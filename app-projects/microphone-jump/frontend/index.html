<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>麦克风跳一跳</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23ffd24a'/%3E%3Cpath d='M5 11L11 5' stroke='%2310141d' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <style>
      .file-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #10141d;
        background: #f4f6fb;
      }

      .file-fallback__panel {
        width: min(420px, 100%);
        padding: 22px;
        border: 1px solid #d8dfec;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(16, 20, 29, 0.12);
      }

      .file-fallback__panel h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }

      .file-fallback__panel p {
        margin: 0 0 18px;
        line-height: 1.6;
        color: #536176;
      }

      .file-fallback__panel a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 8px;
        color: #111318;
        background: #ffd24a;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main id="app" class="app-shell">
      <section class="file-fallback">
        <div class="file-fallback__panel">
          <h1>麦克风跳一跳</h1>
          <p>这个 H5 需要通过本地服务打开。当前服务已启动时，请点击下面的本地预览地址。</p>
          <a href="http://127.0.0.1:5316/">打开本地预览</a>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
