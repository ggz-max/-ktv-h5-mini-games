<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>阅读 H5 - 静光手绘交互原型</title>
  <style>
    :root {
      --w: 390px;
      --h: 585px;
      --paper: #f1e3c7;
      --paper-light: #fff8e9;
      --paper-deep: #ead6ad;
      --sage: #586b43;
      --sage-soft: #73846a;
      --sage-dark: #405134;
      --terracotta: #a9683f;
      --clay: #c98a5e;
      --ink: #3d3328;
      --muted: #8e8372;
      --line: rgba(96, 78, 54, .16);
      --shadow: 0 14px 34px rgba(103, 77, 42, .13);
      --shadow-soft: 0 8px 20px rgba(103, 77, 42, .09);
      --serif: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
      --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background:
        radial-gradient(circle at 50% 28%, rgba(255, 248, 231, .34), transparent 34%),
        #d7c6a6;
      font-family: var(--sans);
      color: var(--ink);
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .stage-shell {
      width: var(--w);
      height: var(--h);
      display: grid;
      place-items: center;
    }

    .phone {
      position: relative;
      width: var(--w);
      height: var(--h);
      overflow: hidden;
      background:
        radial-gradient(circle at 28% 4%, rgba(255, 255, 255, .45), transparent 22%),
        linear-gradient(110deg, rgba(255, 247, 226, .94), rgba(243, 226, 195, .9) 48%, rgba(235, 205, 160, .84));
      box-shadow: 0 28px 80px rgba(66, 47, 25, .26);
      isolation: isolate;
      transform: scale(var(--stage-scale, 1));
      transform-origin: center;
    }

    .phone::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background-image:
        radial-gradient(circle at 40% 12%, rgba(255, 255, 255, .36), transparent 22%),
        radial-gradient(circle at 58% 25%, rgba(106, 121, 80, .11) 0 2px, transparent 4px),
        radial-gradient(circle at 33% 70%, rgba(118, 90, 53, .06) 0 2px, transparent 5px);
      background-size: 100% 100%, 90px 110px, 140px 170px;
      opacity: .7;
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    .phone::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      opacity: .1;
      pointer-events: none;
      background:
        linear-gradient(0deg, rgba(92, 64, 34, .18) 0 1px, transparent 1px 4px),
        linear-gradient(90deg, rgba(92, 64, 34, .12) 0 1px, transparent 1px 5px);
      filter: blur(.15px);
      mix-blend-mode: multiply;
    }

    .sun-wash {
      position: absolute;
      left: 148px;
      top: -10px;
      width: 250px;
      height: 420px;
      z-index: 3;
      background:
        radial-gradient(ellipse at 35% 20%, rgba(255, 255, 255, .5), transparent 34%),
        radial-gradient(ellipse at 67% 40%, rgba(255, 243, 209, .4), transparent 38%),
        linear-gradient(100deg, transparent, rgba(180, 145, 87, .16), transparent 76%);
      opacity: .95;
      clip-path: polygon(22% 0, 100% 0, 84% 100%, 0 100%);
      pointer-events: none;
    }

    .scene-right {
      position: absolute;
      left: 146px;
      top: 31px;
      width: 243px;
      height: 424px;
      z-index: 8;
      background-image: url("assets/scene-right.png");
      background-size: 100% 100%;
      background-repeat: no-repeat;
      opacity: .98;
      pointer-events: none;
      mix-blend-mode: multiply;
      -webkit-mask-image:
        radial-gradient(ellipse at 78% 28%, #000 0 44%, transparent 74%),
        radial-gradient(ellipse at 73% 65%, #000 0 40%, transparent 72%);
      mask-image:
        radial-gradient(ellipse at 78% 28%, #000 0 44%, transparent 74%),
        radial-gradient(ellipse at 73% 65%, #000 0 40%, transparent 72%);
    }

    .scene-right::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(244, 230, 200, .18), transparent 26%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 20;
      width: 100%;
      height: 100%;
      padding: 25px 21px 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .status {
      height: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      color: #111;
      margin-bottom: 26px;
      flex: 0 0 auto;
    }

    .system-icons {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .signal {
      display: inline-flex;
      align-items: end;
      gap: 2px;
      height: 14px;
    }

    .signal i {
      width: 3px;
      background: #111;
      border-radius: 999px;
    }

    .signal i:nth-child(1) { height: 5px; }
    .signal i:nth-child(2) { height: 8px; }
    .signal i:nth-child(3) { height: 11px; }
    .signal i:nth-child(4) { height: 14px; }

    .wifi {
      width: 16px;
      height: 12px;
      position: relative;
      border-top: 4px solid #111;
      border-radius: 16px 16px 0 0;
    }

    .wifi::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 3px;
      width: 8px;
      height: 8px;
      border-top: 4px solid #111;
      border-radius: 10px 10px 0 0;
    }

    .battery {
      width: 22px;
      height: 12px;
      border: 2px solid #111;
      border-radius: 3px;
      position: relative;
    }

    .battery::before {
      content: "";
      position: absolute;
      right: -4px;
      top: 3px;
      width: 2px;
      height: 5px;
      background: #111;
      border-radius: 0 2px 2px 0;
    }

    .battery::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 2px;
      width: 14px;
      height: 6px;
      background: #111;
      border-radius: 1px;
    }

    .app-header {
      flex: 0 0 auto;
    }

    .greeting {
      margin: 0 0 10px 8px;
      font-family: var(--serif);
      font-size: 15px;
      letter-spacing: .04em;
    }

    .stage-title {
      margin: 0 0 16px 5px;
      font-family: var(--serif);
      color: var(--sage);
      font-size: 34px;
      font-weight: 500;
      letter-spacing: .14em;
      line-height: 1;
    }

    .app-view {
      position: relative;
      z-index: 24;
      flex: 1 1 auto;
      min-height: 330px;
      overflow-y: auto;
      overflow-x: hidden;
      margin-bottom: 56px;
      padding: 0 0 34px;
      scrollbar-width: none;
    }

    .app-view::-webkit-scrollbar,
    .sheet-body::-webkit-scrollbar,
    .reader-page::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .view {
      animation: view-in .18s ease both;
    }

    @keyframes view-in {
      from {
        opacity: 1;
        transform: translateY(3px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon {
      width: 20px;
      height: 20px;
      display: inline-block;
      flex: 0 0 auto;
    }

    .icon svg {
      width: 100%;
      height: 100%;
      display: block;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .plain-button {
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      color: inherit;
      text-align: inherit;
      cursor: pointer;
    }

    .current-card {
      width: 207px;
      height: 104px;
      margin-left: 0;
      border-radius: 19px;
      background: rgba(255, 250, 236, .8);
      border: 1px solid rgba(255, 255, 255, .6);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      backdrop-filter: blur(2px);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .current-card:hover {
      background: rgba(255, 252, 242, .88);
      box-shadow: 0 16px 38px rgba(103, 77, 42, .16);
    }

    .current-card:active,
    .quick:active,
    .pill-button:active,
    .icon-button:active,
    .rec-item:active,
    .nav-item:active {
      transform: scale(.98);
    }

    .cover {
      width: 52px;
      height: 78px;
      border-radius: 5px;
      box-shadow: 0 5px 10px rgba(50, 39, 27, .18);
      overflow: hidden;
      background: #ddd2bf;
    }

    .cover img,
    .thumb img,
    .sheet-cover img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .book-title {
      display: block;
      margin: 0 0 10px;
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 500;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .percent {
      display: block;
      margin-bottom: 6px;
      color: var(--sage);
      font-size: 15px;
    }

    .progress {
      display: block;
      width: 93px;
      height: 4px;
      border-radius: 999px;
      background: rgba(119, 102, 73, .26);
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress i {
      display: block;
      height: 100%;
      width: var(--progress, 42%);
      background: var(--sage);
      border-radius: inherit;
      transition: width .24s ease;
    }

    .chapter {
      display: block;
      color: var(--muted);
      font-size: 12px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .streak {
      margin: 9px 0 8px;
      min-width: 146px;
      height: 26px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 12px;
      background: rgba(255, 250, 236, .78);
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255, 255, 255, .55);
      font-size: 13px;
      color: var(--ink);
      white-space: nowrap;
    }

    .streak .icon {
      width: 16px;
      height: 16px;
      color: var(--sage);
    }

    .quick-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .quick {
      width: 50px;
      height: 51px;
      border-radius: 13px;
      background: rgba(255, 250, 236, .76);
      border: 1px solid rgba(255, 255, 255, .6);
      box-shadow: var(--shadow-soft);
      display: grid;
      place-items: center;
      gap: 2px;
      padding: 8px 0 6px;
      color: var(--ink);
      cursor: pointer;
      transition: transform .18s ease, color .18s ease, background .18s ease;
    }

    .quick:hover {
      color: var(--sage-dark);
      background: rgba(255, 252, 242, .9);
    }

    .quick .icon {
      width: 22px;
      height: 22px;
      color: var(--sage);
    }

    .quick span {
      font-size: 12px;
    }

    .section-title {
      margin: 0 0 12px 2px;
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .section-head {
      width: 286px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 8px 2px;
    }

    .section-head .section-title {
      margin: 0;
    }

    .text-link {
      border: 0;
      background: transparent;
      color: var(--sage);
      font-size: 12px;
      padding: 0;
      cursor: pointer;
      white-space: nowrap;
    }

    .daily-card,
    .plan-card,
    .topic-card,
    .author-card,
    .collection-card,
    .review-card,
    .book-review-card,
    .audio-card,
    .insight-panel,
    .library-card,
    .goal-card,
    .reader-setting,
    .catalog-item,
    .insight-card,
    .preference-row {
      border: 1px solid rgba(255, 255, 255, .58);
      background: rgba(255, 250, 236, .78);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(2px);
    }

    .daily-card {
      width: 286px;
      min-height: 98px;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .daily-card h3,
    .plan-card h3,
    .topic-card h3,
    .review-card h3,
    .book-review-card h3,
    .audio-card h3,
    .insight-panel h3,
    .library-card h3,
    .goal-card h3,
    .reader-setting h3,
    .preference-row h3 {
      margin: 0 0 6px;
      font-family: var(--serif);
      font-size: 17px;
      color: var(--sage-dark);
      font-weight: 700;
    }

    .daily-card p,
    .plan-card p,
    .topic-card p,
    .review-card p,
    .book-review-card p,
    .audio-card p,
    .insight-panel p,
    .library-card p,
    .goal-card p,
    .reader-setting p,
    .preference-row p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .metric {
      min-height: 46px;
      border-radius: 14px;
      padding: 8px;
      background: rgba(88, 107, 67, .08);
    }

    .metric strong {
      display: block;
      color: var(--sage);
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 5px;
    }

    .metric span {
      color: #786d5e;
      font-size: 10px;
      white-space: nowrap;
    }

    .insight-panel {
      width: 286px;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .week-bars {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
      align-items: end;
      height: 74px;
      margin-top: 12px;
    }

    .week-bar {
      display: grid;
      gap: 5px;
      justify-items: center;
      align-items: end;
      color: var(--muted);
      font-size: 10px;
    }

    .week-bar i {
      width: 18px;
      min-height: 8px;
      height: var(--height, 20px);
      border-radius: 999px 999px 6px 6px;
      background: rgba(88, 107, 67, .28);
      box-shadow: inset 0 -10px 0 rgba(88, 107, 67, .18);
    }

    .week-bar.active i {
      background: var(--sage);
      box-shadow: inset 0 -10px 0 rgba(255, 248, 233, .16);
    }

    .tag-bars {
      display: grid;
      gap: 9px;
      margin-top: 12px;
    }

    .tag-bar {
      display: grid;
      grid-template-columns: 46px 1fr 34px;
      gap: 8px;
      align-items: center;
      color: #756b5d;
      font-size: 11px;
    }

    .tag-bar i {
      height: 7px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--sage), rgba(88, 107, 67, .22));
      width: var(--width, 40%);
    }

    .search-box {
      width: 286px;
      height: 38px;
      display: grid;
      grid-template-columns: 20px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      margin-bottom: 10px;
      border-radius: 999px;
      background: rgba(255, 250, 236, .76);
      border: 1px solid rgba(255, 255, 255, .64);
      box-shadow: var(--shadow-soft);
    }

    .search-box input {
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
    }

    .search-box input::placeholder {
      color: rgba(117, 107, 93, .72);
    }

    .chip-scroll {
      width: 286px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      margin: 0 0 12px;
      padding-bottom: 2px;
    }

    .chip-scroll::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .chip {
      height: 28px;
      border: 1px solid rgba(255, 255, 255, .62);
      border-radius: 999px;
      background: rgba(255, 248, 233, .66);
      color: #766b5d;
      padding: 0 11px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip.active {
      background: var(--sage);
      color: #fff8e9;
      border-color: rgba(64, 81, 52, .22);
    }

    .search-shelf,
    .author-feed {
      width: 286px;
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .search-shelf {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .search-prompt {
      min-height: 58px;
      border: 1px solid rgba(255, 255, 255, .62);
      border-radius: 16px;
      padding: 9px 10px;
      background: rgba(255, 248, 233, .68);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
    }

    .search-prompt b {
      display: block;
      margin-bottom: 3px;
      color: var(--sage-dark);
      font-family: var(--serif);
      font-size: 14px;
    }

    .search-prompt span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
    }

    .search-summary {
      width: 286px;
      border-radius: 16px;
      padding: 10px 12px;
      margin-bottom: 12px;
      background: rgba(88, 107, 67, .08);
      color: #665b4d;
      font-size: 12px;
      line-height: 1.55;
    }

    .search-summary strong {
      color: var(--sage-dark);
      font-family: var(--serif);
    }

    .plan-card {
      width: 286px;
      min-height: 64px;
      border-radius: 18px;
      padding: 9px 12px;
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .ring {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        conic-gradient(var(--sage) calc(var(--value, .4) * 1turn), rgba(119, 102, 73, .18) 0),
        rgba(255, 248, 233, .72);
      color: var(--sage-dark);
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 700;
      box-shadow: inset 0 0 0 6px rgba(255, 250, 236, .86);
    }

    .topic-grid {
      width: 286px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-bottom: 13px;
    }

    .topic-card {
      min-height: 84px;
      border-radius: 16px;
      padding: 11px;
      cursor: pointer;
      color: inherit;
    }

    .home-task-card {
      width: 286px;
      min-height: 68px;
      display: grid;
      grid-template-columns: 1fr auto;
      column-gap: 12px;
      align-items: center;
      padding: 10px 12px;
    }

    .home-task-card h3 {
      font-size: 15px;
      margin-bottom: 4px;
    }

    .home-task-card p {
      font-size: 11px;
      line-height: 1.45;
    }

    .home-task-card .action-strip {
      margin: 0;
      justify-content: flex-end;
      align-self: center;
    }

    .home-task-card .pill-button {
      min-width: 60px;
      height: 28px;
      padding: 0 11px;
      font-size: 12px;
    }

    .task-list {
      display: grid;
      gap: 9px;
      width: 286px;
    }

    .task-index {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(88, 107, 67, .1);
      color: var(--sage-dark);
      font-family: var(--serif);
      font-weight: 700;
      font-size: 13px;
    }

    .review-card {
      width: 286px;
      min-height: 92px;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }

    .review-card::after {
      content: "";
      position: absolute;
      right: 14px;
      bottom: 12px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(88, 107, 67, .07);
      pointer-events: none;
    }

    .review-card blockquote {
      margin: 0 0 8px;
      font-family: var(--serif);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.55;
      position: relative;
      z-index: 1;
    }

    .review-card.compact {
      min-height: 82px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .review-card.compact blockquote {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .book-review-card {
      width: 286px;
      min-height: 82px;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .audio-card {
      width: 286px;
      min-height: 116px;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .audio-card.compact {
      min-height: 96px;
    }

    .audio-card.compact .audio-points {
      display: none;
    }

    .audio-meter {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }

    .audio-meter span:first-child {
      height: 6px;
      border-radius: 999px;
      background: rgba(119, 102, 73, .2);
      overflow: hidden;
    }

    .audio-meter i {
      display: block;
      width: var(--progress, 0%);
      height: 100%;
      border-radius: inherit;
      background: var(--sage);
    }

    .audio-meter b {
      color: var(--sage-dark);
      font-size: 11px;
      font-weight: 700;
    }

    .audio-points {
      margin: 10px 0 0;
      padding-left: 18px;
      color: #665b4d;
      font-size: 12px;
      line-height: 1.6;
    }

    .topic-card h3 {
      font-size: 15px;
      margin-bottom: 6px;
    }

    .author-card {
      width: 286px;
      min-height: 92px;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .collection-list {
      width: 286px;
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .collection-card {
      min-height: 92px;
      border-radius: 18px;
      padding: 12px;
    }

    .author-card h3 {
      margin: 0 0 6px;
      font-family: var(--serif);
      color: var(--sage-dark);
      font-size: 16px;
    }

    .author-card p,
    .collection-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .topic-card p {
      font-size: 11px;
    }

    .insight-card h3 {
      margin: 0 0 6px;
      font-family: var(--serif);
      color: var(--sage-dark);
      font-size: 16px;
    }

    .insight-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .room-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 0;
    }

    .library-list {
      width: 286px;
      display: grid;
      gap: 10px;
    }

    .library-card {
      min-height: 92px;
      border-radius: 18px;
      padding: 10px;
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 12px;
      color: inherit;
      cursor: pointer;
    }

    .library-card .thumb {
      width: 52px;
      height: 68px;
      border-radius: 7px;
    }

    .library-meta {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .library-card .source-line,
    .library-card .sample-line {
      margin-top: 4px;
      font-size: 11px;
      line-height: 1.45;
      color: #7f7567;
    }

    .mini-tag {
      height: 20px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      padding: 0 7px;
      background: rgba(88, 107, 67, .1);
      color: var(--sage-dark);
      font-size: 10px;
      white-space: nowrap;
    }

    .book-note {
      width: 286px;
      margin: 10px 0 12px;
      padding: 10px 12px;
      border-radius: 16px;
      color: #756b5d;
      background: rgba(255, 248, 233, .58);
      border: 1px dashed rgba(96, 78, 54, .18);
      font-size: 12px;
      line-height: 1.55;
    }

    .recommend {
      width: 286px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 0 0 8px;
    }

    .rec-item {
      width: 100%;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 8px;
      align-items: center;
      min-height: 58px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, .6);
      background: rgba(255, 250, 236, .82);
      box-shadow: var(--shadow-soft);
      padding: 8px;
      color: inherit;
      cursor: pointer;
      transition: transform .18s ease;
    }

    .rec-item .thumb {
      width: 34px;
      height: 44px;
      border-radius: 6px;
    }

    .rec-item + .rec-item {
      margin-top: 0;
    }

    .thumb {
      width: 44px;
      height: 44px;
      border-radius: 5px;
      overflow: hidden;
      box-shadow: 0 3px 9px rgba(65, 48, 26, .12);
      background: #e2d3b4;
    }

    .rec-text {
      min-width: 0;
    }

    .rec-title {
      display: block;
      margin: 0 0 4px;
      font-family: var(--serif);
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rec-meta {
      display: block;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 10px;
    }

    .rec-desc {
      display: none;
      color: #756b5d;
      font-size: 11px;
      overflow: hidden;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      text-overflow: ellipsis;
      line-height: 1.35;
    }

    .rec-item .chev {
      display: none;
    }

    .chev {
      color: #8c806f;
      font-size: 28px;
      line-height: 1;
      transform: translateY(-1px);
    }

    .segmented {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      margin: 0 0 12px;
      border-radius: 999px;
      background: rgba(255, 248, 233, .66);
      border: 1px solid rgba(255, 255, 255, .58);
      box-shadow: 0 6px 16px rgba(103, 77, 42, .08);
    }

    .segmented button {
      min-width: 52px;
      height: 28px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #766b5d;
      font-size: 12px;
      cursor: pointer;
      transition: background .18s ease, color .18s ease;
    }

    .segmented button.active {
      background: var(--sage);
      color: #fff8e9;
    }

    .book-list,
    .note-list,
    .profile-list,
    .notification-list,
    .preference-list {
      display: grid;
      gap: 10px;
      width: 286px;
    }

    .book-row,
    .note-row,
    .notification-row,
    .stat-card,
    .essay-card,
    .profile-row,
    .preference-row {
      border: 1px solid rgba(255, 255, 255, .58);
      background: rgba(255, 250, 236, .78);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(2px);
    }

    .book-row {
      display: grid;
      grid-template-columns: 50px 1fr auto;
      align-items: center;
      gap: 12px;
      min-height: 76px;
      padding: 9px 11px;
      border-radius: 16px;
      color: inherit;
    }

    .book-row .thumb {
      width: 42px;
      height: 54px;
      border-radius: 5px;
    }

    .row-title,
    .note-row h3,
    .notification-row h3,
    .essay-card h3,
    .profile-row h3 {
      display: block;
      margin: 0 0 5px;
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
    }

    .book-row p,
    .note-row p,
    .notification-row p,
    .essay-card p,
    .profile-row p {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .notification-row {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: start;
      gap: 10px;
      min-height: 78px;
      padding: 10px 11px;
      border-radius: 16px;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .notification-row.unread {
      background: rgba(255, 248, 233, .9);
    }

    .notification-dot {
      position: relative;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(88, 107, 67, .12);
      color: var(--sage);
    }

    .notification-row.unread .notification-dot::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      margin: -18px 0 0 18px;
      border-radius: 50%;
      background: var(--terracotta);
      border: 2px solid var(--paper-light);
    }

    .notification-row small {
      color: var(--sage);
      font-size: 10px;
      white-space: nowrap;
    }

    .book-row .mini-progress {
      display: block;
      width: 88px;
      height: 4px;
      margin-top: 8px;
      border-radius: 999px;
      background: rgba(119, 102, 73, .22);
      overflow: hidden;
    }

    .mini-progress i {
      display: block;
      width: var(--progress, 0%);
      height: 100%;
      border-radius: inherit;
      background: var(--sage);
    }

    .book-row-flags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 7px;
    }

    .row-progress-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 7px;
      color: var(--sage-dark);
      font-size: 10px;
      white-space: nowrap;
    }

    .offline-row {
      grid-template-columns: 46px 1fr auto;
      cursor: default;
    }

    .row-action {
      min-width: 44px;
      min-height: 32px;
      padding: 0 10px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: var(--sage);
      background: rgba(255, 248, 233, .72);
      border: 1px solid rgba(255, 255, 255, .62);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .essay-card {
      width: 286px;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .essay-top {
      display: grid;
      grid-template-columns: 54px 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }

    .essay-top .thumb {
      width: 54px;
      height: 54px;
    }

    .pill-line {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .tag {
      height: 24px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      padding: 0 9px;
      background: rgba(88, 107, 67, .1);
      color: var(--sage-dark);
      font-size: 11px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 88px);
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-card {
      height: 74px;
      border-radius: 16px;
      padding: 10px;
    }

    .stat-card strong {
      display: block;
      margin-bottom: 6px;
      font-family: var(--serif);
      color: var(--sage);
      font-size: 20px;
      font-weight: 700;
    }

    .stat-card span {
      font-size: 11px;
      color: var(--muted);
    }

    .calendar-grid {
      width: 286px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin: 10px 0 12px;
    }

    .calendar-day {
      height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .58);
      background: rgba(255, 250, 236, .72);
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 10px;
      box-shadow: var(--shadow-soft);
    }

    .calendar-day strong {
      display: block;
      color: var(--sage-dark);
      font-size: 13px;
      line-height: 1;
    }

    .calendar-day.active {
      background: rgba(105, 126, 81, .18);
      color: var(--sage-dark);
    }

    .achievement-grid {
      width: 286px;
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .achievement-card {
      border-radius: 16px;
      padding: 11px 12px;
      border: 1px solid rgba(255, 255, 255, .58);
      background: rgba(255, 250, 236, .74);
      box-shadow: var(--shadow-soft);
    }

    .achievement-card.locked {
      opacity: .58;
    }

    .achievement-card h3 {
      margin: 0 0 4px;
      font-family: var(--serif);
      color: var(--sage-dark);
      font-size: 15px;
    }

    .achievement-card p {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .note-row,
    .profile-row {
      width: 286px;
      border-radius: 16px;
      padding: 12px;
    }

    .preference-row {
      width: 286px;
      min-height: 66px;
      border-radius: 16px;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }

    .note-row blockquote {
      margin: 0 0 8px;
      font-family: var(--serif);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.55;
    }

    .note-tools {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .note-tools button {
      height: 26px;
      border: 0;
      border-radius: 999px;
      background: rgba(88, 107, 67, .1);
      color: var(--sage-dark);
      padding: 0 9px;
      font-size: 11px;
      cursor: pointer;
    }

    .note-editor {
      width: 286px;
      border-radius: 18px;
      padding: 14px;
      background: rgba(255, 250, 236, .82);
      border: 1px solid rgba(255, 255, 255, .64);
      box-shadow: var(--shadow-soft);
    }

    .note-editor label {
      display: grid;
      gap: 8px;
      color: var(--sage-dark);
      font-size: 13px;
      font-weight: 700;
    }

    .note-editor textarea {
      width: 100%;
      min-height: 112px;
      resize: vertical;
      border: 1px solid rgba(96, 78, 54, .18);
      border-radius: 14px;
      padding: 11px 12px;
      background: rgba(255, 255, 255, .54);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.55;
      outline: 0;
    }

    .note-editor textarea:focus {
      border-color: rgba(88, 107, 67, .45);
      box-shadow: 0 0 0 3px rgba(88, 107, 67, .12);
    }

    .text-importer {
      display: grid;
      gap: 10px;
      margin: 14px 0 12px;
    }

    .text-importer label {
      display: grid;
      gap: 7px;
      color: var(--sage-dark);
      font-size: 13px;
      font-weight: 700;
    }

    .text-importer input,
    .text-importer textarea {
      width: 100%;
      border: 1px solid rgba(96, 78, 54, .18);
      border-radius: 14px;
      padding: 11px 12px;
      background: rgba(255, 255, 255, .56);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.55;
      outline: 0;
    }

    .text-importer textarea {
      min-height: 132px;
      resize: vertical;
    }

    .text-importer input:focus,
    .text-importer textarea:focus {
      border-color: rgba(88, 107, 67, .45);
      box-shadow: 0 0 0 3px rgba(88, 107, 67, .12);
    }

    .note-editor .book-note {
      width: auto;
      margin-top: 10px;
    }

    .action-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 0;
    }

    .shelf-tools {
      width: 286px;
      margin: 0 0 10px;
    }

    .shelf-tools .pill-button {
      flex: 1;
      min-width: 0;
    }

    .pill-button {
      min-width: 86px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .66);
      background: var(--sage);
      color: #fff8e9;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 13px;
      box-shadow: 0 8px 18px rgba(64, 81, 52, .18);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
      white-space: nowrap;
      font-size: 13px;
    }

    .pill-button.secondary {
      background: rgba(255, 250, 236, .78);
      color: var(--sage-dark);
      box-shadow: var(--shadow-soft);
    }

    .pill-button.ghost {
      background: rgba(255, 248, 233, .58);
      color: #766b5d;
      box-shadow: none;
    }

    .pill-button.compact {
      min-width: 64px;
      height: 28px;
      padding: 0 10px;
      font-size: 11px;
    }

    .icon-button {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .66);
      background: rgba(255, 250, 236, .78);
      color: var(--sage);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }

    .empty-note {
      width: 286px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(255, 250, 236, .58);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      border: 1px dashed rgba(96, 78, 54, .22);
    }

    .bottom-nav {
      position: absolute;
      left: 19px;
      right: 19px;
      bottom: 6px;
      z-index: 90;
      height: 49px;
      border-radius: 22px;
      background: rgba(255, 250, 236, .86);
      border: 1px solid rgba(255, 255, 255, .7);
      box-shadow: 0 10px 25px rgba(82, 58, 30, .16);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      backdrop-filter: blur(4px);
    }

    .nav-item {
      height: 100%;
      border: 0;
      background: transparent;
      display: grid;
      place-items: center;
      gap: 2px;
      color: #8a8071;
      font-size: 11px;
      cursor: pointer;
      transition: transform .18s ease, color .18s ease;
    }

    .nav-item .icon {
      width: 20px;
      height: 20px;
    }

    .nav-item.active {
      color: var(--sage);
      font-weight: 700;
    }

    .nav-item.active .icon svg {
      fill: currentColor;
      stroke: currentColor;
    }

    .sheet-layer {
      position: absolute;
      inset: 0;
      z-index: 130;
      pointer-events: none;
    }

    .sheet-layer.active {
      pointer-events: auto;
    }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(66, 47, 25, .18);
      backdrop-filter: blur(1px);
      animation: fade-in .2s ease both;
    }

    .sheet {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 12px;
      max-height: 430px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 250, 236, .96), rgba(244, 229, 197, .95)),
        var(--paper-light);
      border: 1px solid rgba(255, 255, 255, .76);
      box-shadow: 0 22px 45px rgba(69, 48, 25, .24);
      padding: 10px 14px 14px;
      animation: sheet-in .24s ease both;
    }

    .sheet-handle {
      width: 42px;
      height: 4px;
      border-radius: 999px;
      background: rgba(96, 78, 54, .24);
      margin: 0 auto 12px;
    }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .sheet-head h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 20px;
      color: var(--sage-dark);
      font-weight: 700;
      letter-spacing: .04em;
    }

    .sheet-body {
      max-height: 332px;
      overflow-y: auto;
      scrollbar-width: none;
      padding-bottom: 6px;
    }

    .sheet-detail {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 14px;
      align-items: start;
    }

    .sheet-cover {
      width: 72px;
      height: 92px;
      border-radius: 8px;
      overflow: hidden;
      background: #ddd2bf;
      box-shadow: 0 6px 14px rgba(50, 39, 27, .16);
    }

    .detail-copy h3 {
      margin: 0 0 7px;
      font-family: var(--serif);
      font-size: 20px;
      color: var(--ink);
    }

    .detail-copy p {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .reader {
      position: absolute;
      inset: 0;
      z-index: 170;
      display: flex;
      flex-direction: column;
      padding: 29px 22px 22px;
      background:
        radial-gradient(circle at 76% 8%, rgba(255, 255, 255, .5), transparent 30%),
        linear-gradient(145deg, #fff8e9, #efdfbf 62%, #e8cc98);
      transform: translateY(106%);
      transition: transform .28s ease;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .26);
    }

    .reader.theme-sepia {
      background:
        radial-gradient(circle at 76% 8%, rgba(255, 255, 255, .5), transparent 30%),
        linear-gradient(145deg, #fff8e9, #efdfbf 62%, #e8cc98);
    }

    .reader.theme-sage {
      background:
        radial-gradient(circle at 76% 8%, rgba(255, 255, 255, .28), transparent 30%),
        linear-gradient(145deg, #edf1df, #cfd9bd 62%, #b7c29b);
    }

    .reader.theme-night {
      background:
        radial-gradient(circle at 78% 8%, rgba(255, 248, 233, .1), transparent 26%),
        linear-gradient(145deg, #2f332a, #20251d 64%, #151a14);
      color: #efe4ce;
    }

    .reader.open {
      transform: translateY(0);
    }

    .reader::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .12;
      background:
        linear-gradient(0deg, rgba(92, 64, 34, .18) 0 1px, transparent 1px 4px),
        radial-gradient(circle at 18% 82%, rgba(169, 104, 63, .2), transparent 26%);
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    .reader-top,
    .reader-bottom {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex: 0 0 auto;
    }

    .reader-title {
      min-width: 0;
    }

    .reader-title h2 {
      margin: 0 0 3px;
      font-family: var(--serif);
      color: var(--sage-dark);
      font-size: 18px;
      font-weight: 700;

      "monday-courage": [
        { title: "先把窗打开", body: ["周一不需要被征服，它只需要你先把窗打开，让一点空气进来。乔木在信里这样写。", "很多勇气并不响亮，它只是让你愿意开始第一件小事。"] },
        { title: "三件小事", body: ["倒一杯水，整理桌面，写下今天最重要的一件事。信纸上的清单很短，却足够把上午扶正。", "行动感不是逼迫自己奔跑，而是知道下一步落在哪里。"] },
        { title: "给傍晚的回信", body: ["傍晚回看时，她发现周一没有想象中锋利。它只是一个普通日子，等人慢慢穿过。", "勇气有时就是不把一天提前判坏。"] }
      ],
      "city-corners": [
        { title: "旧书店门口", body: ["旧书店门口的风铃很小，只有推门的人才听得见。雨迟站在街角，记下第一条路线。", "城市的边角不是多余的地方，它们只是还没有被匆忙命名。"] },
        { title: "背街路线", body: ["主路很亮，背街却有慢下来的空间。她沿着墙根走，看见一家只在傍晚开灯的修表店。", "旅行不一定发生在远方，有时只是换一条路回家。"] },
        { title: "路口停留", body: ["在红灯前停下的几十秒，足够看见一棵树、一张旧海报和一个陌生人的影子。", "城市把很多故事放在边角，等愿意慢一点的人经过。"] }
      ],
      "post-office": [
        { title: "没有寄出的明信片", body: ["邮局的门铃很旧，每响一次，像替某个迟到的人说了一声抱歉。白舟拆开第一封没有寄出的明信片。", "信上只有一句话：如果你还记得那条河，就回来看看。"] },
        { title: "旧柜台", body: ["柜台后面的木格子写着许多名字，有些已经搬走，有些再也没有人来取信。", "小镇的故事不是发生在大街上，而是藏在被遗忘的地址里。"] },
        { title: "迟到的人", body: ["傍晚有人推门进来，问三年前那封信还在不在。邮局忽然安静得像一页纸。", "原来有些迟到不是错过，而是故事终于找到该抵达的人。"] }
      ],
      "rain-map": [
        { title: "伞下的路口", body: ["雨把城市的声音洗低了一层，路口于是有了重新选择的余地。雨迟在伞下画出第一条线。", "她发现每一次停下，都像给心情留一个岔路口。"] },
        { title: "公交站", body: ["公交站牌被雨水照得发亮，等待的人都把声音收小。她读到这里，忽然不急着车来。", "雨天地图不是为了抵达，而是为了记录那些临时变慢的分钟。"] },
        { title: "水洼", body: ["水洼里有倒过来的楼和一小块天。城市原来也会在低处重新展开。", "她把这一段保存下来，等下一个雨天再读。"] }
      ],
      "night-harbor": [
        { title: "灯塔以北", body: ["灯塔没有催促船只靠岸，它只是让黑暗里的人知道方向还在。程雾把第一晚写给北方海面。", "夜航的风很冷，却让人从日常里抬起头来。"] },
        { title: "陌生港口", body: ["港口的灯一盏接一盏亮起，陌生语言从甲板下方传来。远方并不热闹，它只是让人重新确认自己。", "她在笔记里写：离开也是一种阅读。"] },
        { title: "回望", body: ["船离岸以后，城市缩成一排微光。程雾没有告别，只把那排光写进页边。", "有些路不是为了到达，而是为了知道自己仍然愿意出发。"] }
      ],
      "desk-universe": [
        { title: "一只蓝色杯子", body: ["桌面不是用来展示自律的，它只是替你留出一块能重新开始的地方。安素先挪开那只蓝色杯子。", "杯底有一圈淡淡的水印，像提醒她：整理从来不是清空，而是重新安排关系。"] },
        { title: "便签和铅笔", body: ["便签只写三件事，铅笔削到刚好能写。桌面小宇宙不大，却能容纳一个安静的上午。", "她把最难的事写在第一行，然后在旁边画了一片小叶子。"] },
        { title: "留白", body: ["最后，她没有把桌面填满。留白像一个邀请，告诉明天的自己还可以坐下来。", "短读完成时，房间仍然普通，但心里多了一块干净的地方。"] }
      ],
      analects: [
        { title: "学而第一", body: ["子曰：学而时习之，不亦说乎？有朋自远方来，不亦乐乎？", "人不知而不愠，不亦君子乎？"] },
        { title: "为政第二", body: ["子曰：为政以德，譬如北辰，居其所而众星共之。", "子曰：诗三百，一言以蔽之，曰：思无邪。"] },
        { title: "八佾第三", body: ["孔子谓季氏：八佾舞于庭，是可忍也，孰不可忍也？", "子曰：人而不仁，如礼何？人而不仁，如乐何？"] },
        { title: "里仁第四", body: ["子曰：里仁为美。择不处仁，焉得知？", "子曰：朝闻道，夕死可矣。"] },
        { title: "公冶长第五", body: ["子谓公冶长：可妻也。虽在缧绁之中，非其罪也。", "子曰：敏而好学，不耻下问，是以谓之文也。"] },
        { title: "雍也第六", body: ["子曰：贤哉，回也！一箪食，一瓢饮，在陋巷。", "人不堪其忧，回也不改其乐。贤哉，回也！"] }
      ],
      daodejing: [
        { title: "第一章", body: ["道可道，非常道；名可名，非常名。", "无名天地之始；有名万物之母。"] },
        { title: "第八章", body: ["上善若水。水善利万物而不争，处众人之所恶，故几于道。", "居善地，心善渊，与善仁，言善信，政善治，事善能，动善时。"] },
        { title: "第十一章", body: ["三十辐共一毂，当其无，有车之用。", "埏埴以为器，当其无，有器之用。"] },
        { title: "第二十二章", body: ["曲则全，枉则直，洼则盈，敝则新。", "少则得，多则惑，是以圣人抱一为天下式。"] },
        { title: "第三十三章", body: ["知人者智，自知者明。胜人者有力，自胜者强。", "知足者富，强行者有志。不失其所者久，死而不亡者寿。"] },
        { title: "第六十四章", body: ["其安易持，其未兆易谋。其脆易泮，其微易散。", "为之于未有，治之于未乱。"] }
      ],
      zhuangzi: [
        { title: "逍遥游", body: ["北冥有鱼，其名为鲲。鲲之大，不知其几千里也。", "化而为鸟，其名为鹏。鹏之背，不知其几千里也。"] },
        { title: "齐物论", body: ["天地与我并生，而万物与我为一。", "既已为一矣，且得有言乎？既已谓之一矣，且得无言乎？"] },
        { title: "养生主", body: ["吾生也有涯，而知也无涯。以有涯随无涯，殆已。", "为善无近名，为恶无近刑，缘督以为经。"] },
        { title: "人间世", body: ["夫道不欲杂，杂则多，多则扰，扰则忧，忧而不救。", "心斋一段常被摘读，适合慢慢放进页边笔记。"] },
        { title: "德充符", body: ["德有所长而形有所忘，人不忘其所忘而忘其所不忘。", "庄子写人物，常把形貌放轻，把精神放重。"] },
        { title: "大宗师", body: ["泉涸，鱼相与处于陆，相呴以湿，相濡以沫。", "不如相忘于江湖，一句里有很深的退让和辽阔。"] }
      ],
      mencius: [
        { title: "梁惠王上", body: ["孟子见梁惠王。王曰：叟，不远千里而来，亦将有以利吾国乎？", "孟子对曰：王何必曰利？亦有仁义而已矣。"] },
        { title: "公孙丑上", body: ["我知言，我善养吾浩然之气。", "其为气也，至大至刚，以直养而无害，则塞于天地之间。"] },
        { title: "滕文公上", body: ["有为神农之言者许行，自楚之滕，踵门而告文公曰。", "孟子文字常在问答里展开，把制度、生活和人心放在一起。"] },
        { title: "离娄上", body: ["离娄之明，公输子之巧，不以规矩，不能成方圆。", "师旷之聪，不以六律，不能正五音。"] },
        { title: "告子上", body: ["恻隐之心，人皆有之；羞恶之心，人皆有之。", "恭敬之心，人皆有之；是非之心，人皆有之。"] },
        { title: "尽心上", body: ["尽其心者，知其性也；知其性，则知天矣。", "存其心，养其性，所以事天也。"] }
      ],
      shijing: [
        { title: "关雎", body: ["关关雎鸠，在河之洲。窈窕淑女，君子好逑。", "参差荇菜，左右流之。窈窕淑女，寤寐求之。"] },
        { title: "蒹葭", body: ["蒹葭苍苍，白露为霜。所谓伊人，在水一方。", "溯洄从之，道阻且长；溯游从之，宛在水中央。"] },
        { title: "桃夭", body: ["桃之夭夭，灼灼其华。之子于归，宜其室家。", "桃之夭夭，有蕡其实。之子于归，宜其家室。"] },
        { title: "硕鼠", body: ["硕鼠硕鼠，无食我黍！三岁贯女，莫我肯顾。", "逝将去女，适彼乐土；乐土乐土，爰得我所。"] },
        { title: "采薇", body: ["昔我往矣，杨柳依依；今我来思，雨雪霏霏。", "行道迟迟，载渴载饥。我心伤悲，莫知我哀。"] },
        { title: "鹿鸣", body: ["呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。", "吹笙鼓簧，承筐是将。人之好我，示我周行。"] }
      ],
      "tang-poems": [
        { title: "春晓", body: ["春眠不觉晓，处处闻啼鸟。", "夜来风雨声，花落知多少。"] },
        { title: "登鹳雀楼", body: ["白日依山尽，黄河入海流。", "欲穷千里目，更上一层楼。"] },
        { title: "静夜思", body: ["床前明月光，疑是地上霜。", "举头望明月，低头思故乡。"] },
        { title: "相思", body: ["红豆生南国，春来发几枝。", "愿君多采撷，此物最相思。"] },
        { title: "送别", body: ["山中相送罢，日暮掩柴扉。", "春草明年绿，王孙归不归。"] },
        { title: "终南别业", body: ["中岁颇好道，晚家南山陲。", "行到水穷处，坐看云起时。"] }
      ],
      fusheng: [
        { title: "闲情记趣", body: ["余忆童稚时，能张目对日，明察秋毫。", "见藐小之物必细察其纹理，故时有物外之趣。"] },
        { title: "闺房记乐", body: ["余生乾隆癸未冬十一月二十有二日，正值太平盛世。", "苏州沧浪亭畔，有沈氏者，名复，字三白。"] },
        { title: "闺房记乐二", body: ["芸既长，娴女红，三口仰其十指供给，克昌家道。", "其癖好与余同，且能察余意，余亦爱怜之。"] },
        { title: "闲情记趣二", body: ["夏蚊成雷，私拟作群鹤舞空，心之所向，则或千或百果然鹤也。", "昂首观之，项为之强。"] },
        { title: "浪游记快", body: ["余游幕无常，所到之处，山水花木皆可寄情。", "浮生文字动人处，正在把普通行旅读成可停留的日常。"] },
        { title: "坎坷记愁", body: ["人生坎坷何为乎来哉？往往皆自作孽耳。", "余则半生经历，皆从此中酿出。"] }
      ],
      liaozhai: [
        { title: "山市", body: ["奂山山市，邑八景之一也，然数年恒不一见。", "孙公子禹年与同人饮楼上，忽见山头有孤塔耸起，高插青冥。"] },
        { title: "促织", body: ["宣德间，宫中尚促织之戏，岁征民间。", "此物故非西产；有华阴令欲媚上官，以一头进。"] },
        { title: "画皮", body: ["太原王生，早行，遇一女郎，抱袱独奔，甚艰于步。", "聊斋的可怖处常在日常门缝里出现，越平静越让人停住。"] },
        { title: "婴宁", body: ["王子服入山寻亲，见一女子拈花微笑，笑声清越。", "婴宁一篇读起来像花影摇动，天真背后却有身世幽微。"] },
        { title: "聂小倩", body: ["宁采臣夜宿兰若，遇女鬼小倩，言语之间有哀怜，也有求脱之意。", "这一页适合夜读，但读完最好留一条笔记，把恐惧和善意分开。"] },
        { title: "狼", body: ["一屠晚归，担中肉尽，止有剩骨。", "途中两狼，缀行甚远。"] }
      ],
      xiyouji: [
        { title: "灵根育孕源流出", body: ["海外有一国土，名曰傲来国。国近大海，海中有一座名山，唤为花果山。", "那座山正当顶上，有一块仙石，其石有三丈六尺五寸高。"] },
        { title: "石猴出世", body: ["内育仙胞，一日迸裂，产一石卵，似圆球样大。", "因见风，化作一个石猴，五官俱备，四肢皆全。"] },
        { title: "拜师学艺", body: ["石猴远涉重洋，寻访仙山，终入菩提祖师门下。", "长篇阅读从这里开始有了方向：名字、法术和心性一同生成。"] },
        { title: "龙宫借宝", body: ["悟空入东海龙宫，试遍兵器，终取如意金箍棒。", "神魔小说的热闹背后，是人物力量第一次被具体看见。"] },
        { title: "大闹天宫", body: ["齐天大圣反下天宫，旌旗招展，诸神齐至。", "读这一回不急着判对错，先看一个人物怎样把天地秩序撞响。"] },
        { title: "美猴王", body: ["众猴听说，即拱伏无违。一个个序齿排班，朝上礼拜，都称千岁大王。", "自此，石猴高登王位，将石字隐了，遂称美猴王。"] }
      ],
      hongloumeng: [
        { title: "甄士隐梦幻识通灵", body: ["满纸荒唐言，一把辛酸泪。都云作者痴，谁解其中味？", "此开卷第一回也。作者自云曾历过一番梦幻之后，故将真事隐去。"] },
        { title: "贾雨村风尘怀闺秀", body: ["那甄士隐禀性恬淡，不以功名为念，每日只以观花修竹、酌酒吟诗为乐。", "雨村见他如此，心中自是欢喜。"] },
        { title: "林黛玉进贾府", body: ["黛玉弃舟登岸，步步留心，时时在意，不肯轻易多说一句话。", "红楼梦的长读从人物初见开始，先记住眼光和规矩。"] },
        { title: "宝黛初会", body: ["宝玉见了黛玉，便说这个妹妹我曾见过的。", "一句熟悉，把神话因缘落进大观园的人情里。"] },
        { title: "刘姥姥一进荣国府", body: ["刘姥姥带着板儿进府，富贵气象与乡野眼光相互照见。", "读这一页时，可以看见红楼梦怎样用小人物打开大宅门。"] },
        { title: "冷子兴演说荣国府", body: ["如今的这宁、荣两门，也都萧疏了，不比先时的光景。", "百足之虫，死而不僵。"] }
      ],
      sanguo: [
        { title: "宴桃园豪杰三结义", body: ["话说天下大势，分久必合，合久必分。", "周末七国分争，并入于秦；及秦灭之后，楚、汉分争，又并入于汉。"] },
        { title: "刘关张", body: ["玄德见他形貌异常，问其姓名。其人曰：某姓关，名羽，字长生，后改云长。", "飞曰：吾庄后有一桃园，花开正盛；明日当于园中祭告天地。"] },
        { title: "青梅煮酒", body: ["曹操与刘备青梅煮酒，论天下英雄。", "三国最有味的地方，常在一句试探和一次沉默之间。"] },
        { title: "三顾茅庐", body: ["玄德三往隆中，风雪与等待都成了求贤的分量。", "读到这里，长篇不只是战事，也开始进入谋略和人的选择。"] },
        { title: "赤壁鏖兵", body: ["江上火起，连环船一时俱燃，风势助成大战。", "赤壁一页适合放进历史分类，也适合看小说如何写局势反转。"] },
        { title: "温酒斩华雄", body: ["操教酾热酒一杯，与关公饮了上马。", "关公曰：酒且斟下，某去便来。"] }
      ],
      shiji: [
        { title: "项羽本纪", body: ["项籍者，下相人也，字羽。初起时，年二十四。", "其季父项梁，梁父即楚将项燕，为秦将王翦所戮者也。"] },
        { title: "鸿门宴", body: ["沛公旦日从百余骑来见项王，至鸿门，谢曰：臣与将军戮力而攻秦。", "项王曰：此沛公左司马曹无伤言之；不然，籍何以至此？"] },
        { title: "高祖本纪", body: ["高祖起于沛中，能聚人，也能在危局里保存自己。", "史记写帝王，不只写成败，也写草莽与制度的转换。"] },
        { title: "孔子世家", body: ["孔子周游列国，言行之间既有理想，也有不得其位的沉郁。", "读世家，适合把人物放回时代的道路上。"] },
        { title: "廉颇蔺相如列传", body: ["完璧归赵、渑池之会、负荆请罪，几段故事连成一组人物气节。", "这一页适合保存为短读：看语言怎样变成行动。"] },
        { title: "垓下之围", body: ["项王军壁垓下，兵少食尽，汉军及诸侯兵围之数重。", "夜闻汉军四面皆楚歌，项王乃大惊。"] }
      ],
      shuihu: [
        { title: "张天师祈禳瘟疫", body: ["话说大宋仁宗天子在位，嘉祐三年三月三日五更三点，天子驾坐紫宸殿。", "忽然朝中奏报：东京开封府瘟疫盛行，军民多有伤损。"] },
        { title: "王教头私走延安府", body: ["东京八十万禁军教头王进，因高俅新近得势，心中不安。", "他扶着老母，连夜收拾行装，离了京师，望延安府路上来。"] },

    let catalogStatus = {
      loaded: false,
      source: "内置种子",
      updatedAt: "",
      message: "使用内置公版书库"
    };

    function mergeById(current, incoming = []) {
      const map = new Map(current.map((item) => [item.id, item]));
      incoming.filter((item) => item && item.id).forEach((item) => {
        map.set(item.id, { ...(map.get(item.id) || {}), ...item });
      });
      return Array.from(map.values());
    }

    function mergeByKeyword(current, incoming = []) {
      const map = new Map(current.map((item) => [item.keyword, item]));
      incoming.filter((item) => item && item.keyword).forEach((item) => {
        map.set(item.keyword, { ...(map.get(item.keyword) || {}), ...item });
      });
      return Array.from(map.values());
    }

    function mergeUniqueList(current, incoming = []) {
      return Array.from(new Set([...current, ...incoming].filter(Boolean)));
    }

    function applyCatalog(catalog = {}) {
      if (!catalog || typeof catalog !== "object") return false;
      publicDomainBooks = mergeById(publicDomainBooks, catalog.publicDomainBooks || []);
      libraryCategories = mergeUniqueList(libraryCategories, catalog.libraryCategories || []);
      topics = mergeById(topics, catalog.topics || []);
      rankings = mergeById(rankings, catalog.rankings || []);
      searchPrompts = mergeByKeyword(searchPrompts, catalog.searchPrompts || []);
      authors = mergeById(authors, catalog.authors || []);
      defaultCollections = mergeById(defaultCollections, catalog.defaultCollections || []);
      pageLibrary = { ...pageLibrary, ...(catalog.pageLibrary || {}) };
      catalogStatus = {
        loaded: true,
        source: catalog.sourceName || "data/catalog.json",
        updatedAt: catalog.updatedAt || "",
        message: catalog.note || "已加载服务器书库"
      };
      return true;
    }

    if (typeof window !== "undefined" && window.JINGGUANG_CATALOG) {
      applyCatalog(window.JINGGUANG_CATALOG);
    }

    const defaultNotes = [
      { id: "n1", text: "学而时习之，不亦说乎？", source: "论语 · 学而第一", date: "今日 15:20" },
      { id: "n2", text: "道可道，非常道；名可名，非常名。", source: "道德经 · 第一章", date: "昨日 21:04" }
    ];

    const CONTENT_VERSION = 5;
    const PROGRESS_PAGE_MODEL_VERSION = 5;
    let runtimeState = null;
    const savedState = readSavedState();
    const hasCurrentContentSeed = savedState.contentVersion === CONTENT_VERSION;
    const savedProgress = savedState.progress || {};
    const savedReaderPages = savedState.readerPages || {};
    const initialImportedBooks = normalizeImportedBooks(savedState.importedBooks || []);
    const savedPreferences = { ...defaultPreferences, ...(savedState.preferences || {}) };
    const usesSeedCollections = !(hasCurrentContentSeed && Array.isArray(savedState.collections));
    const savedCollections = normalizeCollections(usesSeedCollections ? defaultCollections : savedState.collections);
    const currentTodayKey = todayKey();
    const hasSavedDailyState = hasCurrentContentSeed && typeof savedState.todayKey === "string";
    const hasTodayDailyState = hasSavedDailyState && savedState.todayKey === currentTodayKey;
    const shouldPersistDailyReset = hasCurrentContentSeed && hasSavedDailyState && !hasTodayDailyState;
    const initialTodayMinutes = hasCurrentContentSeed
      ? (hasTodayDailyState ? safeMinutes(savedState.todayMinutes, 0) : 0)
      : 18;
    const initialCheckedIn = hasTodayDailyState ? Boolean(savedState.checkedIn) : false;
    const defaultSelectedBookId = hasCurrentContentSeed ? (savedState.selectedBookId || "analects") : "analects";
    const initialProgress = { analects: savedState.analectsProgress ?? 33, camellia: savedState.camelliaProgress ?? 42, ...savedProgress };
    const initialReaderPages = normalizeReaderPages(
      initialProgress,
      savedReaderPages,
      defaultSelectedBookId,
      savedState.readerPage,
      hasCurrentContentSeed && savedState.progressPageModelVersion === PROGRESS_PAGE_MODEL_VERSION
    );
    const defaultShelfIds = ["analects", "daodejing", "tang-poems", "fusheng", "shijing", "shishuo", "caigentan"];
    const expandedShelfIds = ["analects", "daodejing", "tang-poems", "fusheng", "shijing", "zizhi", "sunzi", "sanzi", "xuxiake"];
    const initialShelfIds = hasCurrentContentSeed && Array.isArray(savedState.shelf) ? savedState.shelf : defaultShelfIds;
    const seededShelfAddedAt = initialShelfIds.reduce((map, bookId, index) => {
      map[bookId] = index + 1;
      return map;
    }, {});
    const initialShelfAddedAt = { ...seededShelfAddedAt, ...(savedState.shelfAddedAt || {}) };
    const initialShelfOrderSeed = Math.max(
      initialShelfIds.length,
      Number(savedState.shelfOrderSeed) || 0,
      ...Object.values(initialShelfAddedAt).map((value) => Number(value) || 0)
    );
    const state = {
      tab: "home",
      selectedBookId: defaultSelectedBookId,
      progress: initialProgress,
      shelfFilter: "all",
      shelfSort: ["recent", "progress", "short"].includes(savedState.shelfSort) ? savedState.shelfSort : "recent",
      discoverCategory: "全部",
      searchQuery: "",
      searchHistory: savedState.searchHistory || [],
      readerSearchQuery: "",
      readerSearchBookId: hasCurrentContentSeed ? (savedState.readerSearchBookId || defaultSelectedBookId) : "analects",
      todayKey: currentTodayKey,
      checkedIn: initialCheckedIn,
      favorites: new Set(hasCurrentContentSeed ? (savedState.favorites || ["analects"]) : ["analects"]),
      shelf: new Set(initialShelfIds),
      shelfAddedAt: initialShelfAddedAt,
      shelfOrderSeed: initialShelfOrderSeed,
      offlineBooks: new Set(hasCurrentContentSeed ? (savedState.offlineBooks || ["analects"]) : ["analects"]),
      importedBooks: initialImportedBooks,
      reviewedItems: new Set(savedState.reviewedItems || []),
      readNotifications: new Set(savedState.readNotifications || []),
      bookReviews: savedState.bookReviews || {},
      audioSessions: savedState.audioSessions || {},
      followedAuthors: new Set(savedState.followedAuthors || []),
      collections: savedCollections,
      focusSessions: savedState.focusSessions || [],
      focusMinutes: savedState.focusMinutes || 18,
      preferences: savedPreferences,
      notes: hasCurrentContentSeed ? (savedState.notes || defaultNotes) : defaultNotes,
      noteDraft: savedState.noteDraft || "",
      noteSource: savedState.noteSource || "",
      importDraftTitle: savedState.importDraftTitle || "",
      importDraftText: savedState.importDraftText || "",
      highlights: savedState.highlights || [],
      sheet: null,
      detailId: null,
      pendingRestartBookId: null,
      readerDrawer: null,
      readerOpen: false,
      readerPages: initialReaderPages,
      selectedParagraphs: {},
      readerFont: savedState.readerFont || 1,
      readerTheme: savedState.readerTheme || savedPreferences.defaultTheme || "sepia",
      dailyGoal: savedState.dailyGoal || 30,
      todayMinutes: initialTodayMinutes,
      copiedCardNoteId: null,
      copiedCardText: "",
      monthlyPlanGeneratedAt: savedState.monthlyPlanGeneratedAt || "",
      monthlyPlanSaved: Boolean(savedState.monthlyPlanSaved)
    };
    runtimeState = state;

    attachShelfOrderTracking();

    function normalizeImportedBooks(items) {
      return items.map((item) => ({
        ...importBookSeed,
        ...item,
        id: item.id || `import-${Date.now()}`,
        imported: true,
        shelves: item.shelves || ["本地", "随笔"],
        pages: Array.isArray(item.pages) ? item.pages : null
      }));
    }

    function importedSamplePages() {
      return [
        { title: "导入 · 第一页", body: ["纸页上有今天早晨留下的铅笔痕，像一段还没有说完的话。你把它导入静光书架，决定先读三页。", "本地书不需要进入公共资源库，它只要能保存进度、笔记和划线，就已经回到你的阅读日常。"] },
        { title: "导入 · 整理段落", body: ["第二页里有一段旧笔记：把要读的材料分成短章，比一次性读完更容易坚持。", "你给它加上页边注，像是在自己的文稿旁边点了一盏小灯。"] },
        { title: "导入 · 明早继续", body: ["最后一页很短，只留下一个提醒：明天早晨先读十分钟，再决定要不要继续。", "导入的意义不是囤材料，而是让私人文本也有可以继续的位置。"] }
      ];
    }

    function normalizeTextParagraphs(text) {
      const lines = String(text || "")
        .replace(/\r/g, "")
        .split(/\n+/)
        .map((line) => line.trim())
        .filter(Boolean);
      if (lines.length > 1) return lines;
      const single = (lines[0] || String(text || "").trim()).replace(/\s+/g, " ");
      if (!single) return [];
      const chunks = single.match(/.{1,120}(?:[。！？；，、\s]|$)/g) || [single];
      return chunks.map((line) => line.trim()).filter(Boolean);
    }

    function buildImportedPages(text) {
      const paragraphs = normalizeTextParagraphs(text);
      const pages = [];
      for (let index = 0; index < paragraphs.length; index += 2) {
        pages.push({
          title: `导入 · 第 ${Math.floor(index / 2) + 1} 页`,
          body: paragraphs.slice(index, index + 2)
        });
      }
      return pages.length ? pages : importedSamplePages();
    }

    function titleFromImportedText(text) {
      const firstLine = normalizeTextParagraphs(text)[0] || "";
      return firstLine.replace(/[。！？；，、\s.,!?;:].*$/, "").slice(0, 18) || "本地文本";
    }

    function createImportedBookFromDraft() {
      const rawText = state.importDraftText.trim();
      if (!rawText) return null;
      const title = (state.importDraftTitle.trim() || titleFromImportedText(rawText)).slice(0, 24);
      const pages = buildImportedPages(rawText);
      const charCount = rawText.replace(/\s/g, "").length;
      return {
        id: `import-${Date.now()}`,
        title,
        author: "本地导入",
        cover: "assets/thumb-plants.svg",
        progress: 0,
        chapter: pages[0]?.title || "导入 · 第 1 页",
        tag: "本地",
        minutes: Math.max(6, Math.ceil(charCount / 350) * 3),
        status: "saved",
        desc: "从粘贴的 TXT 文本生成，可在阅读器中保存位置、笔记和划线。",
        source: "本地导入",
        license: "私人导入文本",
        rating: "过程",
        readers: "仅自己",
        reason: "这本书来自你粘贴的文本，可以像公版书一样连续阅读。",
        shelves: ["本地", "TXT"],
        sample: pages[0]?.body?.[0] || "",
        imported: true,
        fileSize: `${Math.max(1, Math.ceil(charCount / 1024))} KB`,
        pages
      };
    }

    function normalizeCollections(items) {
      return items.map((item) => ({
        id: item.id || `collection-${Date.now()}`,
        title: item.title || "我的书单",
        desc: item.desc || "把最近想读的书放在一起。",
        books: Array.isArray(item.books) ? [...new Set(item.books)] : [],
        pinned: Boolean(item.pinned)
      }));
    }

    function readSavedState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch (error) {
        return {};
      }
    }

    function todayKey(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function safeMinutes(value, fallback = 0) {
      const minutes = Number(value);
      if (!Number.isFinite(minutes) || minutes < 0) return fallback;
      return Math.min(180, minutes);
    }

    function ensureTodayState() {
      const key = todayKey();
      if (state.todayKey === key) return false;
      state.todayKey = key;
      state.checkedIn = false;
      state.todayMinutes = 0;
      return true;
    }

    function addTodayMinutes(minutes) {
      ensureTodayState();
      state.todayMinutes = safeMinutes(state.todayMinutes + (Number(minutes) || 0), state.todayMinutes);
      return state.todayMinutes;
    }

    function saveState() {
      ensureTodayState();
      const camelliaProgress = state.progress.camellia ?? 42;
      const analectsProgress = state.progress.analects ?? 33;
      const payload = {
        contentVersion: CONTENT_VERSION,
        progressPageModelVersion: PROGRESS_PAGE_MODEL_VERSION,
        selectedBookId: state.selectedBookId,
        camelliaProgress,
        analectsProgress,
        progress: state.progress,
        shelfSort: state.shelfSort,
        searchHistory: state.searchHistory,
        readerSearchBookId: state.readerSearchBookId,
        todayKey: state.todayKey,
        checkedIn: state.checkedIn,
        favorites: Array.from(state.favorites),
        shelf: Array.from(state.shelf),
        shelfAddedAt: state.shelfAddedAt,
        shelfOrderSeed: state.shelfOrderSeed,
        offlineBooks: Array.from(state.offlineBooks),
        importedBooks: state.importedBooks,
        reviewedItems: Array.from(state.reviewedItems),
        readNotifications: Array.from(state.readNotifications),
        bookReviews: state.bookReviews,
        audioSessions: state.audioSessions,
        followedAuthors: Array.from(state.followedAuthors),
        collections: state.collections,
        focusSessions: state.focusSessions,
        focusMinutes: state.focusMinutes,
        preferences: state.preferences,
        notes: state.notes,
        noteDraft: state.noteDraft,
        noteSource: state.noteSource,
        importDraftTitle: state.importDraftTitle,
        importDraftText: state.importDraftText,
        highlights: state.highlights,
        readerPage: currentReaderPage(),
        readerPages: state.readerPages,
        readerFont: state.readerFont,
        readerTheme: state.readerTheme,
        dailyGoal: state.dailyGoal,
        todayMinutes: state.todayMinutes,
        monthlyPlanGeneratedAt: state.monthlyPlanGeneratedAt,
        monthlyPlanSaved: state.monthlyPlanSaved
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (error) {
        return undefined;
      }
    }

    function attachShelfOrderTracking() {
      const addToShelf = state.shelf.add.bind(state.shelf);
      const deleteFromShelf = state.shelf.delete.bind(state.shelf);
      state.shelf.add = (bookId) => {
        if (!bookId) return state.shelf;
        const order = Number(state.shelfAddedAt[bookId]);
        if (!state.shelf.has(bookId) || !Number.isFinite(order)) {
          state.shelfOrderSeed += 1;
          state.shelfAddedAt[bookId] = state.shelfOrderSeed;
        }
        addToShelf(bookId);
        return state.shelf;
      };
      state.shelf.delete = (bookId) => {
        const deleted = deleteFromShelf(bookId);
        if (deleted) delete state.shelfAddedAt[bookId];
        return deleted;
      };
    }

    function rebuildDefaultContentState() {
      const availableIds = new Set(allBookSources().map((book) => book.id));
      const shelfIds = expandedShelfIds.filter((bookId) => availableIds.has(bookId));
      state.collections = normalizeCollections(defaultCollections);
      state.shelf = new Set(shelfIds);
      state.offlineBooks = new Set(["analects"]);
      state.favorites = new Set(["analects"]);
      state.shelfAddedAt = shelfIds.reduce((map, bookId, index) => {
        map[bookId] = index + 1;
        return map;
      }, {});
      state.shelfOrderSeed = shelfIds.length;
      attachShelfOrderTracking();
    }

    async function loadRemoteCatalog() {
      if (typeof fetch !== "function") return;
      try {
        const response = await fetch("data/catalog.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const catalog = await response.json();
        if (!applyCatalog(catalog)) return;
        if (usesSeedCollections) rebuildDefaultContentState();
        saveState();
        render();
      } catch (error) {
        catalogStatus = {
          ...catalogStatus,
          loaded: false,
          message: "服务器书库未连接，当前使用内置种子"
        };
      }
    }

    function allBookSources() {
      return [...publicDomainBooks, ...baseBooks, ...state.importedBooks];
    }

    function isResourceBook(book) {
      return Boolean(book.imported || book.sourceUrl || book.license?.includes("公版"));
    }

    function getBooks() {
      return allBookSources().map((book) => ({
        ...book,
        progress: state.progress[book.id] ?? book.progress,
        status: bookStatus(book, state.progress[book.id] ?? book.progress),
        inShelf: state.shelf.has(book.id),
        favorite: state.favorites.has(book.id),
        offline: state.offlineBooks.has(book.id)
      }));
    }

    function resourceBooks() {
      return getBooks().filter(isResourceBook);
    }

    function bookStatus(book, progress = book.progress || 0) {
      if (progress >= 100) return "finished";
      if (progress > 0 || hasSavedReaderPosition(book.id) || book.id === state.selectedBookId) return "reading";
      return "saved";
    }

    function hasSavedReaderPosition(bookId) {
      return currentReaderPage(bookId) > 0;
    }

    function hasReadableProgress(book) {
      const progress = state.progress[book.id] ?? book.progress ?? 0;
      return progress > 0 || hasSavedReaderPosition(book.id);
    }

    function hasStartedBook(book) {
      return hasReadableProgress(book) || book.id === state.selectedBookId;
    }

    function currentBook() {
      return getBooks().find((book) => book.id === state.selectedBookId) || getBooks()[0];
    }

    function continueBook() {
      const books = getBooks();
      return books.find((book) => state.shelf.has(book.id) && hasReadableProgress(book))
        || books.find((book) => state.shelf.has(book.id))
        || currentBook();
    }

    function currentPageSource(bookId = state.selectedBookId) {
      const book = getBooks().find((item) => item.id === bookId) || currentBook();
      const pages = bookPages(book.id);
      const page = pages[currentReaderPage(book.id) % pages.length] || pages[0] || { title: "阅读" };
      return `${book.title} · ${page.title}`;
    }

    function readerParagraph(paragraphIndex = 0, bookId = state.selectedBookId) {
      const book = getBooks().find((item) => item.id === bookId) || currentBook();
      const pages = bookPages(book.id);
      const pageIndex = currentReaderPage(book.id);
      const page = pages[pageIndex % pages.length] || pages[0] || { title: "阅读", body: [] };
      const index = Math.min(Math.max(Number(paragraphIndex) || 0, 0), Math.max(0, page.body.length - 1));
      return {
        book,
        page,
        pageIndex,
        paragraphIndex: index,
        text: page.body[index] || ""
      };
    }

    function selectedParagraphIndex(bookId = state.selectedBookId) {
      const saved = state.selectedParagraphs?.[bookId];
      const page = bookPages(bookId)[currentReaderPage(bookId)] || { body: [] };
      if (saved && saved.pageIndex === currentReaderPage(bookId)) {
        return Math.min(Math.max(Number(saved.paragraphIndex) || 0, 0), Math.max(0, page.body.length - 1));
      }
      return 0;
    }

    function selectParagraph(paragraphIndex = 0, bookId = state.selectedBookId) {
      const paragraph = readerParagraph(paragraphIndex, bookId);
      state.selectedParagraphs[bookId] = {
        pageIndex: paragraph.pageIndex,
        paragraphIndex: paragraph.paragraphIndex
      };
      return paragraph;
    }

    function paragraphSource(target = readerParagraph()) {
      return `${target.book.title} · ${target.page.title} · 第 ${target.paragraphIndex + 1} 段`;
    }

    function currentChapterTitle(book) {
      const pages = bookPages(book.id);
      const page = pages[currentReaderPage(book.id) % pages.length] || pages[0];
      return page?.title || book.chapter || "阅读";
    }

    function openNoteEditor(source = currentPageSource(), draft = state.noteDraft || "") {
      state.noteSource = source;
      state.noteDraft = draft;
      state.sheet = "noteEditor";
      renderSheet();
    }

    function bookPages(bookId = state.selectedBookId) {
      const importedBook = (runtimeState?.importedBooks || initialImportedBooks).find((book) => book.id === bookId);
      if (importedBook?.pages?.length) return importedBook.pages;
      if (bookId === importBookSeed.id) return importedSamplePages();
      return pageLibrary[bookId] || pageLibrary.default;
    }

    function clampReaderPage(bookId = state.selectedBookId, pageIndex = 0) {
      const pageCount = bookPages(bookId).length || 1;
      return Math.min(Math.max(Number(pageIndex) || 0, 0), pageCount - 1);
    }

    function currentReaderPage(bookId = state.selectedBookId) {
      return clampReaderPage(bookId, state.readerPages?.[bookId] ?? 0);
    }

    function setReaderPage(bookId = state.selectedBookId, pageIndex = 0) {
      state.readerPages[bookId] = clampReaderPage(bookId, pageIndex);
      return state.readerPages[bookId];
    }

    function ensureReaderPageForBook(bookId = state.selectedBookId) {
      if (state.readerPages[bookId] === undefined) {
        setReaderPage(bookId, readerPageForProgress(bookId, state.progress[bookId] || 0));
      }
      return currentReaderPage(bookId);
    }

    function readerPageForProgress(bookId, progress = 0) {
      const pages = bookPages(bookId);
      if (!pages.length) return 0;
      const bounded = Math.min(100, Math.max(0, Number(progress) || 0));
      if (bounded <= 0) return 0;
      const reachedPage = Math.max(0, Math.round((bounded / 100) * pages.length) - 1);
      return clampReaderPage(bookId, reachedPage);
    }

    function normalizeReaderPages(progressMap = {}, pageMap = {}, selectedBookId = "analects", legacyReaderPage = 0, isCurrentModel = false) {
      const normalized = {};
      Object.entries(pageMap || {}).forEach(([bookId, pageIndex]) => {
        normalized[bookId] = clampReaderPage(bookId, pageIndex);
      });
      if (isCurrentModel && normalized[selectedBookId] === undefined && legacyReaderPage !== undefined) {
        normalized[selectedBookId] = clampReaderPage(selectedBookId, legacyReaderPage);
      }
      Object.entries(progressMap || {}).forEach(([bookId, progress]) => {
        if ((Number(progress) || 0) > 0 && normalized[bookId] === undefined) {
          normalized[bookId] = readerPageForProgress(bookId, progress);
        }
      });
      if (normalized[selectedBookId] === undefined) {
        normalized[selectedBookId] = readerPageForProgress(selectedBookId, progressMap?.[selectedBookId] || 0);
      }
      return normalized;
    }

    function pageProgress(bookId = state.selectedBookId, pageIndex = currentReaderPage(bookId)) {
      const pages = bookPages(bookId);
      if (!pages.length) return 0;
      return Math.min(100, Math.round(((clampReaderPage(bookId, pageIndex) + 1) / pages.length) * 100));
    }

    function completedProgress(bookId = state.selectedBookId, pageIndex = currentReaderPage(bookId)) {
      return pageProgress(bookId, pageIndex);
    }

    function bookVisibleProgress(book) {
      return hasStartedBook(book) ? pageProgress(book.id, currentReaderPage(book.id)) : 0;
    }

    function bookPositionLabel(book) {
      if (!hasStartedBook(book)) return "未开始";
      return `读到 ${currentReaderPage(book.id) + 1}/${bookPages(book.id).length} 页`;
    }

    function pageForCompletedProgress(bookId = state.selectedBookId, progress = 0) {
      return readerPageForProgress(bookId, progress);
    }

    function syncProgressToReaderPage(bookId = state.selectedBookId, pageIndex = currentReaderPage(bookId)) {
      const book = getBooks().find((item) => item.id === bookId) || currentBook();
      const current = state.progress[book.id] ?? book.progress ?? 0;
      const reached = completedProgress(book.id, pageIndex);
      if (reached <= 0) return current;
      state.progress[book.id] = Math.max(current, reached);
      return state.progress[book.id];
    }

    function advanceBookProgress(bookId, delta, options = {}) {
      const book = getBooks().find((item) => item.id === bookId) || currentBook();
      const current = state.progress[book.id] ?? book.progress ?? 0;
      const next = Math.min(100, Math.max(current, current + delta));
      state.progress[book.id] = next;
      const currentPage = currentReaderPage(book.id);
      const progressPage = pageForCompletedProgress(book.id, next);
      const targetPage = options.advancePage ? Math.max(progressPage, Math.min(bookPages(book.id).length - 1, currentPage + 1)) : progressPage;
      if (targetPage > currentReaderPage(book.id)) setReaderPage(book.id, targetPage);
      return next;
    }

    function libraryBooks() {
      const query = state.searchQuery.trim().toLowerCase();
      const prompt = searchPrompts.find((item) => item.keyword.toLowerCase() === query);
      return resourceBooks().filter((book) => {
        const categoryMatched = state.discoverCategory === "全部" || book.tag === state.discoverCategory || book.shelves.includes(state.discoverCategory);
        const haystack = [book.title, book.author, book.tag, book.desc, book.source, book.license, book.reason, ...book.shelves].join(" ").toLowerCase();
        const promptMatched = prompt && (book.tag === prompt.category || book.shelves.includes(prompt.category));
        const queryMatched = !query || promptMatched || haystack.includes(query) || query.split(/\s+/).every((word) => word && haystack.includes(word));
        return categoryMatched && queryMatched;
      });
    }

    function searchMatches(query = state.searchQuery) {
      const keyword = query.trim().toLowerCase();
      if (!keyword) {
        return {
          books: [],
          topics: [],
          authors: [],
          rankings: []
        };
      }
      const textIncludes = (parts) => parts.join(" ").toLowerCase().includes(keyword);
      return {
        books: resourceBooks().filter((book) => textIncludes([book.title, book.author, book.tag, book.desc, book.source, book.license, book.reason, ...book.shelves])),
        topics: topics.filter((topic) => textIncludes([topic.title, topic.desc, topic.category, topic.curator, topic.note])),
        authors: authors.filter((author) => textIncludes([author.name, author.title, author.bio])),
        rankings: rankings.filter((ranking) => textIncludes([ranking.title, ranking.desc, ranking.rule]))
      };
    }

    function discoverScopeSummary(bookCount, query = state.searchQuery.trim()) {
      if (query) {
        return `搜索会在书名、作者、主题、来源和推荐理由里查找；已自动回到全库范围，当前命中 ${bookCount} 本。`;
      }
      if (state.discoverCategory === "全部") {
        return `资源库共 ${bookCount} 本，只展示真实公版作品和本地导入书；原型样章不进入主资源库。`;
      }
      return `当前分类：${state.discoverCategory}，命中 ${bookCount} 本。分类会同时匹配主题标签和书架分组。`;
    }

    function rememberSearch(query = state.searchQuery) {
      const keyword = query.trim();
      if (!keyword) return;
      state.searchHistory = [keyword, ...state.searchHistory.filter((item) => item !== keyword)].slice(0, 5);
      saveState();
    }

    function shelfBooks() {
      const books = getBooks().filter((book) => state.shelf.has(book.id));
      const sourceIndex = (book) => allBookSources().findIndex((item) => item.id === book.id);
      return books.sort((a, b) => {
        if (state.shelfSort === "recent") {
          return (Number(state.shelfAddedAt[b.id]) || 0) - (Number(state.shelfAddedAt[a.id]) || 0) || sourceIndex(a) - sourceIndex(b);
        }
        if (state.shelfSort === "progress") return bookVisibleProgress(b) - bookVisibleProgress(a) || b.progress - a.progress;
        if (state.shelfSort === "short") return a.minutes - b.minutes;
        return sourceIndex(a) - sourceIndex(b);
      });
    }

    function shelfFilterDescription(filter = state.shelfFilter) {
      const descriptions = {
        all: "全部显示已加入书架、导入或正在读的书。",
        reading: "在读按当前位置判断：有已保存页码、当前位置记录，或当前正在阅读。",
        saved: "待读显示已入架但还没有开始、也没有保存阅读位置的书，适合安排下一本。",
        finished: "读完只收纳已经到最后一页并写过完读记录的书。"
      };
      return descriptions[filter] || descriptions.all;
    }

    function shelfFilterLabel(filter = state.shelfFilter) {
      const labels = {
        all: "全部书架",
        reading: "在读",
        saved: "待读",
        finished: "读完"
      };
      return labels[filter] || labels.all;
    }

    function shelfSortLabel(sort = state.shelfSort) {
      const labels = {
        recent: "最近加入",
        progress: "位置优先",
        short: "短读优先"
      };
      return labels[sort] || labels.recent;
    }

    function bookStatusLabel(book) {
      if (book.progress >= 100) return "读完";
      if (hasStartedBook(book)) return "在读";
      return "待读";
    }

    function bookRowActionText(book) {
      if (book.progress >= 100) return "回看";
      if (hasStartedBook(book)) return "继续";
      return "开始";
    }

    function collectionById(collectionId = state.activeCollectionId) {
      return state.collections.find((collection) => collection.id === collectionId) || state.collections[0];
    }

    function collectionBooks(collection = collectionById()) {
      return collection.books.map((bookId) => getBooks().find((book) => book.id === bookId)).filter(Boolean);
    }

    function collectionReadingSummary(collection = collectionById()) {
      const books = collectionBooks(collection);
      const started = books.filter(hasStartedBook);
      const topProgress = started.length ? Math.max(...started.map(bookVisibleProgress)) : 0;
      return {
        books,
        minutes: books.reduce((sum, book) => sum + book.minutes, 0),
        startedCount: started.length,
        topProgress
      };
    }

    function suggestedCollectionForBook(book = currentBook()) {
      return state.collections.find((collection) => collection.books.includes(book.id))
        || state.collections.find((collection) => collection.title.includes("晨") && book.shelves.includes("晨读"))
        || state.collections.find((collection) => collection.title.includes("自然") && book.shelves.includes("自然"))
        || state.collections[0];
    }

    function readingStats() {
      const books = getBooks();
      const finished = books.filter((book) => book.progress >= 100).length;
      const average = Math.round(books.reduce((sum, book) => sum + book.progress, 0) / books.length);
      return {
        finished,
        average,
        notes: state.notes.length,
