        highlights: state.highlights.length,
        favorites: state.favorites.size,
        shelf: state.shelf.size
      };
    }

    function reviewItems() {
      const notes = state.notes.map((note) => ({
        id: `note:${note.id}`,
        kind: "笔记",
        text: note.text,
        source: note.source,
        date: note.date
      }));
      const highlights = state.highlights.map((item) => ({
        id: `highlight:${item.id}`,
        kind: "划线",
        text: item.text,
        source: item.source,
        date: item.date
      }));
      return [...notes, ...highlights];
    }

    function dueReviewItems() {
      const items = reviewItems();
      return items.filter((item) => !state.reviewedItems.has(item.id)).concat(items.filter((item) => state.reviewedItems.has(item.id)));
    }

    function weeklyMinutes() {
      const base = [12, 24, 16, 32, 18, 26, state.todayMinutes];
      return base.map((minutes, index) => ({
        label: ["一", "二", "三", "四", "五", "六", "日"][index],
        minutes,
        active: index === 6
      }));
    }

    function tagStats() {
      const counts = shelfBooks().reduce((map, book) => {
        map[book.tag] = (map[book.tag] || 0) + 1;
        return map;
      }, {});
      const max = Math.max(...Object.values(counts), 1);
      return Object.entries(counts)
        .map(([tag, count]) => ({ tag, count, width: Math.max(18, Math.round((count / max) * 100)) }))
        .sort((a, b) => b.count - a.count)
        .slice(0, 4);
    }

    function weeklySummary() {
      const week = weeklyMinutes();
      const total = week.reduce((sum, day) => sum + day.minutes, 0);
      const stats = readingStats();
      const collectionBooks = new Set(state.collections.flatMap((collection) => collection.books)).size;
      return {
        total,
        average: Math.round(total / week.length),
        days: week.filter((day) => day.minutes > 0).length,
        collectionBooks,
        reviewed: state.reviewedItems.size,
        activeTag: tagStats()[0]?.tag || "散文",
        stats
      };
    }

    function readingCalendar() {
      return weeklyMinutes().map((day, index) => ({
        ...day,
        date: ["06/14", "06/15", "06/16", "06/17", "06/18", "06/19", "今日"][index],
        level: day.minutes >= state.dailyGoal ? "full" : day.minutes > 0 ? "active" : "empty"
      }));
    }

    function achievements() {
      const stats = readingStats();
      const finished = getBooks().filter((book) => book.progress >= 100).length;
      const collectionBookCount = new Set(state.collections.flatMap((collection) => collection.books)).size;
      return [
        { id: "streak", title: "连续阅读者", desc: "本周 7 天都有阅读分钟。", unlocked: weeklySummary().days >= 7 },
        { id: "note", title: "页边采光", desc: "累计留下 3 条笔记。", unlocked: state.notes.length >= 3 },
        { id: "highlight", title: "句子收藏家", desc: "至少保存 1 条划线。", unlocked: state.highlights.length > 0 },
        { id: "finish", title: "读完一本书", desc: "至少 1 本书进度到 100%。", unlocked: finished > 0 },
        { id: "collection", title: "书架整理师", desc: "个人书单收录 4 本以上。", unlocked: collectionBookCount >= 4 },
        { id: "review", title: "复习回声", desc: "至少回看 1 张书摘卡。", unlocked: state.reviewedItems.size > 0 }
      ];
    }

    function nextRecommendation(bookId = state.selectedBookId) {
      const current = getBooks().find((book) => book.id === bookId) || currentBook();
      return getBooks().find((book) => book.id !== current.id && !state.shelf.has(book.id))
        || getBooks().find((book) => book.id !== current.id && book.progress < 100)
        || getBooks().find((book) => book.id !== current.id)
        || current;
    }

    function noteCardText(note) {
      if (!note) return "";
      return `「${note.text}」\n${note.source} · ${note.date}\n静光阅读 · 把喜欢的句子留在光里`;
    }

    function monthlyPlanSections() {
      const shelf = shelfBooks();
      const current = getBooks().find((book) => book.id === state.selectedBookId) || currentBook();
      const reading = shelf.filter((book) => hasStartedBook(book) && book.progress < 100)
        .sort((a, b) => bookVisibleProgress(b) - bookVisibleProgress(a) || a.minutes - b.minutes);
      const unread = shelf.filter((book) => !hasStartedBook(book)).sort((a, b) => a.minutes - b.minutes);
      const candidates = getBooks().filter((book) => !state.shelf.has(book.id) && book.id !== current.id).slice(0, 4);
      const keepReading = reading.length ? reading.slice(0, 3) : [current];
      return [
        { id: "continue", title: "继续读", desc: "优先把已经开始的书读稳，不让进度散掉。", books: keepReading },
        { id: "short", title: "本月短读", desc: "从书架里挑短章，适合碎片时间完成。", books: unread.slice(0, 3) },
        { id: "next", title: "下月候选", desc: "来自资源库但还没入架的真实公版书。", books: candidates }
      ].filter((section) => section.books.length);
    }

    function monthlyPlanCandidateBooks() {
      const section = monthlyPlanSections().find((item) => item.id === "next");
      return section ? section.books : [];
    }

    function authorForBook(book) {
      return authors.find((author) => author.name === book.author)
        || authors.find((author) => author.books.includes(book.id))
        || authors[0];
    }

    function isPublicDomainBookId(bookId) {
      return publicDomainBooks.some((book) => book.id === bookId);
    }

    function publicDomainAuthors() {
      return authors.filter((author) => author.books.some(isPublicDomainBookId));
    }

    function defaultAuthorLane() {
      return publicDomainAuthors().slice(0, 3);
    }

    function topicById(topicId) {
      return topics.find((topic) => topic.id === topicId) || topics[0];
    }

    function rankingById(rankingId = state.activeRankingId) {
      return rankings.find((ranking) => ranking.id === rankingId) || rankings[0];
    }

    function notificationItems() {
      const continueTarget = continueBook();
      const dynamicSeeds = notificationSeeds.map((item) => {
        if (item.id === "daily-plan") {
          return {
            ...item,
            text: `今天可以继续读《${continueTarget.title}》，先翻到第 ${getBookPageIndex(continueTarget.id) + 1} 页。`,
            bookId: continueTarget.id
          };
        }
        if (item.id === "review-card") {
          return {
            ...item,
            text: `复习盒里有 ${dueReviewItems().filter((review) => !state.reviewedItems.has(review.id)).length} 张书摘卡等待回看。`
          };
        }
        if (item.id === "offline-pack") {
          return {
            ...item,
            text: `当前已缓存 ${state.offlineBooks.size} 本，睡前可以再缓存一本短读书。`
          };
        }
        return item;
      });
      return dynamicSeeds.map((item) => ({
        ...item,
        unread: !state.readNotifications.has(item.id)
      }));
    }

    function unreadNotificationCount() {
      return notificationItems().filter((item) => item.unread).length;
    }

    function notificationById(notificationId) {
      return notificationItems().find((item) => item.id === notificationId) || notificationItems()[0];
    }

    function readerSearchResults(bookId = state.readerSearchBookId || state.selectedBookId, query = state.readerSearchQuery) {
      const keyword = query.trim().toLowerCase();
      if (!keyword) return [];
      return bookPages(bookId).flatMap((page, pageIndex) => {
        const haystack = [page.title, ...page.body].join(" ").toLowerCase();
        if (!haystack.includes(keyword)) return [];
        const paragraph = page.body.find((text) => text.toLowerCase().includes(keyword)) || page.body[0] || page.title;
        const start = Math.max(0, paragraph.toLowerCase().indexOf(keyword) - 8);
        const snippet = paragraph.slice(start, start + 44);
        return [{ pageIndex, title: page.title, snippet }];
      });
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function icon(name) {
      const paths = {
        home: '<path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/>',
        shelf: '<path d="M5 5h4v14H5z"/><path d="M11 5h4v14h-4z"/><path d="M17 6l3 12"/>',
        discover: '<circle cx="12" cy="12" r="8"/><path d="m15 9-2 6-4 2 2-6z"/>',
        profile: '<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="M5 21c1-4 4-6 7-6s6 2 7 6"/>',
        leaf: '<path fill="currentColor" stroke="none" d="M14.8 3.8c-4.3 1.1-7.2 4-8.4 8.4-.6 2.3-.2 4.2 1.1 5.5 1.4 1.4 3.7 1.6 5.8.5 3.5-1.8 5.6-6.4 5.2-11.5-.1-1.5-.6-2.5-1.3-2.8-.5-.3-1.3-.3-2.4-.1Z"/><path d="M5 20c2.6-5.9 5.6-9.7 10.7-13"/>',
        note: '<path d="M5 5h12v14H5z"/><path d="M13 11l6-6 2 2-6 6-3 1z"/>',
        star: '<path d="m12 4 2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/>',
        search: '<circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/>',
        spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/>',
        close: '<path d="m6 6 12 12"/><path d="M18 6 6 18"/>',
        play: '<path d="M8 5v14l11-7z"/>',
        bookmark: '<path d="M7 5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16l-5-3-5 3z"/>',
        catalog: '<path d="M5 5h14"/><path d="M5 12h14"/><path d="M5 19h14"/>',
        settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a8 8 0 0 0 .1-2l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1L15 5h-4l-.4 3a7 7 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a8 8 0 0 0 .1 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.4 3h4l.4-3a7 7 0 0 0 1.7-1l2.4 1 2-3.5z"/>',
        highlighter: '<path d="m4 20 5-1 10-10-4-4L5 15z"/><path d="m14 6 4 4"/><path d="M4 20h8"/>',
        plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
        check: '<path d="m5 12 4 4L19 6"/>',
        bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',
        heart: '<path d="M20 8.5c0 5.2-8 10.5-8 10.5S4 13.7 4 8.5A4.4 4.4 0 0 1 8.4 4c1.5 0 2.8.7 3.6 1.8A4.5 4.5 0 0 1 20 8.5Z"/>',
        chevron: '<path d="m9 18 6-6-6-6"/>',
        back: '<path d="m15 18-6-6 6-6"/>',
        textDown: '<path d="M5 18h6"/><path d="M8 18V8"/><path d="m5 8 3-3 3 3"/><path d="M15 18h4"/><path d="M17 18v-7"/>',
        textUp: '<path d="M4 18h8"/><path d="M8 18V6"/><path d="m4 6 4-3 4 3"/><path d="M15 18h5"/><path d="M17.5 18V9"/>'
      };
      return `<span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor">${paths[name] || ""}</svg></span>`;
    }

    function render() {
      const tab = tabs[state.tab];
      greetingEl.textContent = tab.greeting;
      titleEl.textContent = tab.title;
      renderNav();
      view.innerHTML = renderView();
      renderSheet();
      renderReader();
    }

    function renderNav() {
      nav.innerHTML = Object.entries(tabs).map(([key, tab]) => `
        <button class="nav-item ${state.tab === key ? "active" : ""}" type="button" data-action="switch-tab" data-tab="${key}">
          ${icon(tab.icon)}
          <span>${tab.label}</span>
        </button>
      `).join("");
    }

    function renderView() {
      if (state.tab === "shelf") return renderShelf();
      if (state.tab === "discover") return renderDiscover();
      if (state.tab === "profile") return renderProfile();
      return renderHome();
    }

    function renderHome() {
      const book = currentBook();
      const recs = resourceBooks().filter((item) => item.id !== book.id && item.progress < 100).slice(0, 2);
      const goalRatio = Math.min(1, state.todayMinutes / state.dailyGoal);
      const visibleProgress = bookVisibleProgress(book);
      const positionLabel = bookPositionLabel(book);
      return `
        <div class="view home-view">
          <article class="plan-card">
            <span>
              <h3>今日阅读计划</h3>
              <p>已读 ${state.todayMinutes} / ${state.dailyGoal} 分钟 · 先读 ${escapeHTML(book.title)}</p>
              <button class="text-link" type="button" data-action="open-focus" data-id="${book.id}">开始专注阅读</button>
            </span>
            <span class="ring" style="--value: ${goalRatio}">${Math.round(goalRatio * 100)}%</span>
          </article>

          <button class="plain-button current-card" type="button" data-action="open-reader">
            <span class="cover"><img src="${book.cover}" alt="${escapeHTML(book.title)}封面"></span>
            <span class="book-info">
              <span class="book-title">${escapeHTML(book.title)}</span>
              <span class="percent">当前位置 ${visibleProgress}%</span>
              <span class="progress" aria-label="当前位置 ${visibleProgress}%"><i style="--progress: ${visibleProgress}%"></i></span>
              <span class="chapter">${escapeHTML(currentChapterTitle(book))} · ${escapeHTML(positionLabel)}</span>
            </span>
          </button>

          <div class="streak" aria-label="今日阅读状态">
            ${icon(state.todayMinutes >= state.dailyGoal ? "check" : "leaf")}
            <span>${state.todayMinutes >= state.dailyGoal ? "今日目标已完成" : `今日已读 ${state.todayMinutes} 分钟`}</span>
          </div>

          <div class="section-head">
            <h2 class="section-title">今日可读</h2>
            <button class="text-link" type="button" data-action="switch-tab" data-tab="discover">更多书</button>
          </div>
          <section class="recommend" aria-label="推荐阅读">
            ${recs.map(renderRecommendItem).join("")}
          </section>

        </div>
      `;
    }

    function renderRecommendItem(item) {
      return `
        <button class="rec-item" type="button" data-action="open-detail" data-id="${item.id}">
          <span class="thumb"><img src="${item.cover}" alt="${escapeHTML(item.title)}"></span>
          <span class="rec-text">
            <span class="rec-title">${escapeHTML(item.title)}</span>
            <span class="rec-meta">${escapeHTML(item.tag)} · ${item.minutes} 分钟</span>
            <span class="rec-desc">${escapeHTML(item.desc)}</span>
          </span>
          <span class="chev">›</span>
        </button>
      `;
    }

    function renderShelf() {
      const books = shelfBooks().filter((book) => {
        if (state.shelfFilter === "all") return true;
        return book.status === state.shelfFilter;
      });
      const filterLabels = {
        all: "全部书架",
        reading: "在读",
        saved: "待读",
        finished: "读完"
      };
      const allShelfBooks = shelfBooks();
      const statusCounts = allShelfBooks.reduce((map, book) => {
        map[book.status] = (map[book.status] || 0) + 1;
        return map;
      }, { reading: 0, saved: 0, finished: 0 });
      const offlineCount = state.offlineBooks.size;
      return `
        <div class="view shelf-view">
          <div class="segmented" role="tablist" aria-label="书架筛选">
            ${[
              ["all", "全部"],
              ["reading", "在读"],
              ["saved", "待读"],
              ["finished", "读完"]
            ].map(([key, label]) => `
              <button type="button" class="${state.shelfFilter === key ? "active" : ""}" data-action="filter-shelf" data-filter="${key}">${label}</button>
            `).join("")}
          </div>
          <div class="chip-scroll" aria-label="书架排序">
            ${[
              ["recent", "最近加入"],
              ["progress", "位置优先"],
              ["short", "短读优先"]
            ].map(([key, label]) => `
              <button class="chip ${state.shelfSort === key ? "active" : ""}" type="button" data-action="sort-shelf" data-sort="${key}">${label}</button>
            `).join("")}
          </div>
          <div class="action-strip shelf-tools">
            <button class="pill-button secondary" type="button" data-action="open-sheet" data-sheet="import">导入书籍</button>
            <button class="pill-button secondary" type="button" data-action="open-sheet" data-sheet="offline">离线书包 ${offlineCount}</button>
          </div>
          <div class="search-summary">
            <strong>${filterLabels[state.shelfFilter] || "全部书架"} · ${shelfSortLabel()}</strong>：当前显示 ${books.length} 本；在读 ${statusCounts.reading || 0} 本、待读 ${statusCounts.saved || 0} 本、读完 ${statusCounts.finished || 0} 本。${shelfFilterDescription()}
          </div>
          <div class="section-head">
            <h2 class="section-title">${filterLabels[state.shelfFilter] || "全部书架"}</h2>
            <span class="tag">${books.length} 本</span>
          </div>
          <div class="book-list shelf-result-list">
            ${books.length ? books.map(renderBookRow).join("") : `<div class="empty-note">这个筛选下暂时没有书。可以切回“全部”，或去发现页加入一本公版书。</div>`}
          </div>
          <div class="book-note">书架只放你主动加入、导入或正在读的书。离线书包适合通勤和睡前不联网阅读。</div>
          <div class="section-head">
            <h2 class="section-title">个人书单</h2>
            <button class="text-link" type="button" data-action="open-sheet" data-sheet="collections">全部</button>
          </div>
          <div class="collection-list">
            ${state.collections.slice(0, 2).map(renderCollectionCard).join("")}
          </div>
        </div>
      `;
    }

    function renderBookRow(book) {
      const isFavorite = state.favorites.has(book.id);
      const statusLabel = bookStatusLabel(book);
      const actionText = bookRowActionText(book);
      const readAction = hasStartedBook(book) ? "resume-book" : "start-book";
      const visibleProgress = bookVisibleProgress(book);
      const positionLabel = bookPositionLabel(book);
      return `
        <article class="book-row">
          <span class="thumb"><img src="${book.cover}" alt="${escapeHTML(book.title)}"></span>
          <button class="plain-button" type="button" data-action="open-detail" data-id="${book.id}" aria-label="查看《${escapeHTML(book.title)}》详情">
            <span class="row-title">${escapeHTML(book.title)}</span>
            <p>${escapeHTML(book.author)} · 当前：${escapeHTML(currentChapterTitle(book))}</p>
            <span class="row-progress-line">
              <span class="mini-progress" aria-label="当前位置 ${visibleProgress}%"><i style="--progress: ${visibleProgress}%"></i></span>
              <b>${visibleProgress}%</b>
              <span>${escapeHTML(positionLabel)}</span>
            </span>
            <span class="book-row-flags">
              <span class="mini-tag">${statusLabel}</span>
              ${isFavorite ? `<span class="mini-tag">已收藏</span>` : ""}
              ${book.imported ? `<span class="mini-tag">本地导入</span>` : ""}
              ${book.offline ? `<span class="mini-tag">已离线</span>` : ""}
            </span>
          </button>
          <button class="row-action" type="button" data-action="${readAction}" data-id="${book.id}" aria-label="${actionText}《${escapeHTML(book.title)}》">${escapeHTML(actionText)}</button>
        </article>
      `;
    }

    function renderCollectionCard(collection) {
      const summary = collectionReadingSummary(collection);
      return `
        <article class="collection-card">
          <h3>${escapeHTML(collection.title)}</h3>
          <p>${escapeHTML(collection.desc)}</p>
          <div class="room-meta">
            <span class="mini-tag">${summary.books.length} 本</span>
            <span class="mini-tag">${summary.minutes} 分钟</span>
            <span class="mini-tag">${summary.startedCount ? `在读 ${summary.startedCount} 本 · ${summary.topProgress}%` : "未开始"}</span>
            <span class="mini-tag">${collection.pinned ? "已固定" : "可固定"}</span>
          </div>
          <div class="action-strip">
            <button class="pill-button" type="button" data-action="open-collection" data-collection="${collection.id}">查看书单</button>
            <button class="pill-button secondary" type="button" data-action="pin-collection" data-collection="${collection.id}">${collection.pinned ? "取消固定" : "固定书单"}</button>
          </div>
        </article>
      `;
    }

    function renderOfflineRow(book) {
      const isOffline = state.offlineBooks.has(book.id);
      return `
        <article class="book-row offline-row">
          <span class="thumb"><img src="${book.cover}" alt="${escapeHTML(book.title)}"></span>
          <span>
            <span class="row-title">${escapeHTML(book.title)}</span>
            <p>${escapeHTML(book.author)} · ${book.minutes} 分钟 · ${isOffline ? "可离线阅读" : "未缓存"}</p>
            <span class="book-row-flags">
              <span class="mini-tag">${isOffline ? "已离线" : "在线"}</span>
              ${book.imported ? `<span class="mini-tag">本地导入</span>` : ""}
            </span>
          </span>
          <button class="pill-button secondary compact" type="button" data-action="toggle-offline" data-id="${book.id}">${isOffline ? "移出离线" : "缓存离线"}</button>
        </article>
      `;
    }

    function renderDiscover() {
      const books = libraryBooks();
      const query = state.searchQuery.trim();
      const matches = searchMatches(query);
      const history = state.searchHistory.slice(0, 4);
      const resourceTitle = query ? "搜索命中的书" : state.discoverCategory === "全部" ? "资源库" : `资源库 · ${state.discoverCategory}`;
      return `
        <div class="view discover-view">
          <div class="search-box" role="search">
            ${icon("search")}
            <input type="search" value="${escapeHTML(state.searchQuery)}" placeholder="搜索书名、作者、主题" data-action="search-library" aria-label="搜索图书">
            <button class="text-link" type="button" data-action="clear-search">清空</button>
          </div>

          ${query ? `
            <div class="search-summary">
              <strong>搜索「${escapeHTML(query)}」</strong>：找到 ${books.length} 本书、${matches.topics.length} 个专题、${matches.authors.length} 位作者、${matches.rankings.length} 个榜单。
            </div>
            <div class="section-head">
              <h2 class="section-title">搜索结果</h2>
              <span class="tag">${books.length} 本</span>
            </div>
            <div class="library-list search-result-list">
              ${books.length ? books.map(renderLibraryCard).join("") : `<div class="empty-note">没有匹配的书，换个更短的关键词或点搜索灵感试试。</div>`}
            </div>
          ` : `
            <div class="section-head">
              <h2 class="section-title">搜索灵感</h2>
              ${history.length ? `<button class="text-link" type="button" data-action="clear-search-history">清除历史</button>` : `<span class="tag">今日推荐</span>`}
            </div>
            <div class="search-shelf">
              ${searchPrompts.map((item) => `
                <button class="plain-button search-prompt" type="button" data-action="use-search-prompt" data-query="${escapeHTML(item.keyword)}" data-category="${escapeHTML(item.category)}">
                  <b>${escapeHTML(item.keyword)}</b>
                  <span>${escapeHTML(item.desc)}</span>
                </button>
              `).join("")}
            </div>
            ${history.length ? `
              <div class="chip-scroll" aria-label="最近搜索">
                ${history.map((item) => `
                  <button class="chip" type="button" data-action="use-search-prompt" data-query="${escapeHTML(item)}">最近：${escapeHTML(item)}</button>
                `).join("")}
              </div>
            ` : ""}
          `}

          ${query ? `
            <div class="search-summary">
              <strong>搜索范围：全库</strong>：${escapeHTML(discoverScopeSummary(books.length, query))}
              <br><strong>书库来源：${escapeHTML(catalogStatus.source)}</strong>：${escapeHTML(catalogStatus.message)}${catalogStatus.updatedAt ? ` · ${escapeHTML(catalogStatus.updatedAt)}` : ""}
            </div>
          ` : `
            <div class="chip-scroll" aria-label="资源分类">
              ${libraryCategories.map((category) => `
                <button class="chip ${state.discoverCategory === category ? "active" : ""}" type="button" data-action="filter-discover" data-category="${category}">${category}</button>
              `).join("")}
            </div>
            <div class="search-summary">
              <strong>筛选：${escapeHTML(state.discoverCategory)}</strong>：${escapeHTML(discoverScopeSummary(books.length, query))}
              <br><strong>书库来源：${escapeHTML(catalogStatus.source)}</strong>：${escapeHTML(catalogStatus.message)}${catalogStatus.updatedAt ? ` · ${escapeHTML(catalogStatus.updatedAt)}` : ""}
            </div>
            <div class="section-head">
              <h2 class="section-title">${escapeHTML(resourceTitle)}</h2>
              <span class="tag">${books.length} 本</span>
            </div>
            <div class="library-list">
              ${books.length ? books.map(renderLibraryCard).join("") : `<div class="empty-note">没有匹配的书。可以清空搜索，或点“公版经典”“唐诗”这类搜索灵感重新开始。</div>`}
            </div>
          `}

          <div class="section-head">
            <h2 class="section-title">阅读榜单</h2>
            <button class="text-link" type="button" data-action="open-ranking" data-ranking="weekly-hot">热读</button>
          </div>
          <div class="topic-grid">
            ${rankings.map((ranking) => `
              <button class="plain-button topic-card" type="button" data-action="open-ranking" data-ranking="${ranking.id}">
                <h3>${escapeHTML(ranking.title)}</h3>
                <p>${escapeHTML(ranking.desc)}</p>
              </button>
            `).join("")}
          </div>

          <div class="section-head">
            <h2 class="section-title">编辑书单</h2>
          </div>
          <div class="topic-grid">
            ${topics.map((topic) => `
              <button class="plain-button topic-card" type="button" data-action="open-topic" data-topic="${topic.id}">
                <h3>${escapeHTML(topic.title)}</h3>
                <p>${escapeHTML(topic.desc)}</p>
              </button>
            `).join("")}
          </div>

          <div class="section-head">
            <h2 class="section-title">作者小径</h2>
            <span class="tag">代表作入口</span>
          </div>
          ${defaultAuthorLane().map(renderAuthorCard).join("")}

        </div>
      `;
    }

    function renderAuthorCard(author) {
      return `
        <article class="author-card">
          <h3>${escapeHTML(author.name)} · ${escapeHTML(author.title)}</h3>
          <p>${escapeHTML(author.bio)}</p>
          <div class="room-meta">
            <span class="mini-tag">${escapeHTML(author.followers)}</span>
            <span class="mini-tag">${author.books.length} 本作品</span>
          </div>
          <div class="action-strip">
            <button class="pill-button" type="button" data-action="open-author" data-author="${author.id}">作者页</button>
            <button class="pill-button secondary" type="button" data-action="save-author-books" data-author="${author.id}">代表作入架</button>
          </div>
        </article>
      `;
    }

    function renderNotificationRow(item) {
      return `
        <button class="plain-button notification-row ${item.unread ? "unread" : ""}" type="button" data-action="open-notification" data-notification="${escapeHTML(item.id)}">
          <span class="notification-dot">${icon(item.kind === "author" ? "profile" : item.kind === "room" ? "spark" : item.kind === "offline" ? "bookmark" : "bell")}</span>
          <span>
            <h3>${escapeHTML(item.title)}</h3>
            <p>${escapeHTML(item.text)}</p>
          </span>
          <small>${escapeHTML(item.time)}</small>
        </button>
      `;
    }

    function renderLibraryCard(book) {
      const actionText = book.inShelf ? "移出书架" : "加入书架";
      const offlineText = book.offline ? "移出离线" : "缓存离线";
      return `
        <article class="library-card">
          <span class="thumb"><img src="${book.cover}" alt="${escapeHTML(book.title)}"></span>
          <span>
            <h3>${escapeHTML(book.title)}</h3>
            <p>${escapeHTML(book.author)} · ${escapeHTML(book.chapter)} · ${escapeHTML(book.desc)}</p>
            <p class="source-line">来源：${escapeHTML(book.source || "静光书库")}${book.license ? ` · ${escapeHTML(book.license)}` : ""}</p>
            <p class="sample-line">试读：${escapeHTML(book.sample || book.chapter)}</p>
            <span class="library-meta">
              <span class="mini-tag">${escapeHTML(book.tag)}</span>
              <span class="mini-tag">${escapeHTML(book.source)}</span>
              ${(book.shelves || []).slice(0, 3).map((tag) => `<span class="mini-tag">${escapeHTML(tag)}</span>`).join("")}
              <span class="mini-tag">${bookPages(book.id).length} 页</span>
              <span class="mini-tag">${book.readers} 在读</span>
            </span>
            <span class="action-strip">
              <button class="pill-button secondary" type="button" data-action="open-detail" data-id="${book.id}">看详情</button>
              <button class="pill-button" type="button" data-action="toggle-shelf" data-id="${book.id}">${actionText}</button>
              <button class="pill-button secondary compact" type="button" data-action="toggle-offline" data-id="${book.id}">${offlineText}</button>
            </span>
          </span>
        </article>
      `;
    }

    function renderProfile() {
      const totalNotes = state.notes.length;
      const totalFavorites = state.favorites.size;
      const stats = readingStats();
      const summary = weeklySummary();
      const unlockedAchievements = achievements().filter((item) => item.unlocked).length;
      return `
        <div class="view profile-view">
          <article class="profile-hero">
            <h3>静光读者</h3>
            <p>本周 ${summary.total} 分钟 · 平均位置 ${stats.average}% · 书架 ${stats.shelf} 本。继续把阅读变成一个舒服的日常。</p>
            <div class="action-strip">
              <button class="pill-button" type="button" data-action="open-sheet" data-sheet="insights">数据中心</button>
              <button class="pill-button secondary" type="button" data-action="open-sheet" data-sheet="highlights">划线书摘</button>
            </div>
          </article>
          <div class="stats-grid" aria-label="阅读统计">
            <div class="stat-card"><strong>12</strong><span>连续天数</span></div>
            <div class="stat-card"><strong>${state.todayMinutes}</strong><span>今日分钟</span></div>
            <div class="stat-card"><strong>${totalNotes}</strong><span>摘抄笔记</span></div>
          </div>
          <div class="profile-list">
            <button class="plain-button profile-row" type="button" data-action="open-sheet" data-sheet="notes">
              <h3>最近笔记</h3>
              <p>${escapeHTML(state.notes[0]?.text || "还没有写下新的句子")}</p>
            </button>
            <button class="plain-button profile-row" type="button" data-action="open-sheet" data-sheet="favorites">
              <h3>收藏书页</h3>
              <p>${totalFavorites} 本书或文章正在书签里等你。</p>
            </button>
            <button class="plain-button profile-row" type="button" data-action="open-sheet" data-sheet="highlights">
              <h3>划线书摘</h3>
              <p>${stats.highlights ? `${stats.highlights} 条高亮，可从阅读器继续整理。` : "阅读器里点“划线”就会收进这里。"}</p>
            </button>
            <button class="plain-button profile-row" type="button" data-action="open-sheet" data-sheet="reviewBox">
              <h3>复习盒</h3>
              <p>${reviewItems().length} 张书摘卡，${reviewItems().filter((item) => !state.reviewedItems.has(item.id)).length} 张等待回看。</p>
            </button>
            <button class="plain-button profile-row" type="button" data-action="open-sheet" data-sheet="insights">
              <h3>阅读数据中心</h3>
              <p>本周 ${summary.days} 天有阅读，偏好主题是 ${summary.activeTag}，书单里整理了 ${summary.collectionBooks} 本。</p>
            </button>
            <button class="plain-button profile-row" type="button" data-action="open-sheet" data-sheet="calendar">
              <h3>阅读日历</h3>
              <p>本周 ${summary.days} 天有阅读，已点亮 ${unlockedAchievements} 枚安静成就。</p>
            </button>
            <button class="plain-button profile-row" type="button" data-action="open-sheet" data-sheet="authors">
              <h3>作者作品</h3>
              <p>按作者查看公版代表作，一键收入书架继续读。</p>
            </button>
            <button class="plain-button profile-row" type="button" data-action="open-sheet" data-sheet="collections">
              <h3>个人书单</h3>
              <p>${state.collections.length} 个场景书单，${state.collections.filter((collection) => collection.pinned).length} 个已固定在书架。</p>
            </button>
            <button class="plain-button profile-row" type="button" data-action="open-sheet" data-sheet="import">
              <h3>导入书籍</h3>
              <p>${state.importedBooks.length ? `已导入 ${state.importedBooks.length} 本本地书，可以和资源库图书一起阅读。` : "把本地文稿、公开文本或学习资料放进静光书架。"}</p>
            </button>
            <button class="plain-button profile-row" type="button" data-action="open-sheet" data-sheet="offline">
              <h3>离线书包</h3>
              <p>${state.offlineBooks.size} 本已缓存，适合地铁、飞行和睡前安静阅读。</p>
            </button>
            <button class="plain-button profile-row" type="button" data-action="open-sheet" data-sheet="preferences">
              <h3>阅读偏好</h3>
              <p>${state.preferences.quietMode ? "安静模式已开启" : "默认主题、轻提醒和翻页计时可在这里调整。"}</p>
            </button>
            <button class="plain-button profile-row" type="button" data-action="open-sheet" data-sheet="plan">
              <h3>月度书单</h3>
              <p>按继续读、本月短读和下月候选整理，不再只导出一串书名。</p>
            </button>
            <button class="plain-button profile-row" type="button" data-action="open-sheet" data-sheet="review">
              <h3>阅读复盘</h3>
              <p>查看本周阅读节奏、偏好主题和下一本推荐。</p>
            </button>
          </div>
        </div>
      `;
    }

    function renderSheet() {
      if (!state.sheet) {
        sheetLayer.className = "sheet-layer";
        sheetLayer.innerHTML = "";
        return;
      }

      const sheetMarkup = state.sheet === "detail"
        ? renderDetailSheet()
        : renderListSheet(state.sheet);

      sheetLayer.className = "sheet-layer active";
      sheetLayer.innerHTML = `
        <button class="plain-button sheet-backdrop" type="button" data-action="close-sheet" aria-label="关闭弹层"></button>
        <div class="sheet" role="dialog" aria-modal="true">
          <div class="sheet-handle" aria-hidden="true"></div>
          ${sheetMarkup}
        </div>
      `;
    }

    function renderListSheet(type) {
      const titles = {
        shelf: "轻书架",
        notes: "页边笔记",
        favorites: "收藏书页",
        catalog: "阅读目录",
        highlights: "划线书摘",
        goal: "阅读目标",
        review: "阅读复盘",
        insights: "数据中心",
        calendar: "阅读日历",
        notifications: "消息提醒",
        reviewBox: "复习盒",
        reviews: "读后感受",
        collections: "个人书单",
        collection: "书单详情",
        finished: "完读小结",
        noteCard: "书摘卡片",
        noteEditor: "写笔记",
        plan: "月度书单",
        readerSearch: "书内查找",
        focus: "专注阅读",
        confirmRestart: "确认从头阅读",
        ranking: "阅读榜单",
        topic: "专题书单",
        authors: "作者作品",
        author: "作者页",
        import: "导入书籍",
        offline: "离线书包",
        preferences: "阅读偏好"
      };
      let body = "";

      function renderNoteEditor(title = "写一条新的页边笔记", placeholder = "写下刚刚读到的句子、想法或问题。") {
        const source = state.noteSource || currentPageSource();
        return `
          <article class="note-editor">
            <label>${title}
              <textarea data-action="edit-note-draft" placeholder="${placeholder}" aria-label="笔记内容">${escapeHTML(state.noteDraft)}</textarea>
            </label>
            <div class="book-note">来源：${escapeHTML(source)}</div>
            <div class="action-strip">
              <button class="pill-button" type="button" data-action="save-note-draft">保存笔记</button>
              <button class="pill-button secondary" type="button" data-action="clear-note-draft">清空</button>
            </div>
          </article>
        `;
      }

      if (type === "shelf") {
        body = `<div class="book-list">${shelfBooks().slice(0, 5).map(renderBookRow).join("")}</div>`;
      }

      if (type === "notes") {
        body = `
          ${renderNoteEditor()}
          ${state.notes.length
            ? `<div class="note-list">${state.notes.map(renderNoteRow).join("")}</div>`
            : `<div class="empty-note">还没有新的摘抄。</div>`}
        `;
      }

      if (type === "noteEditor") {
        body = renderNoteEditor("页边笔记", "写下你自己的理解、疑问或摘句。");
      }

      if (type === "favorites") {
        const favorites = getBooks().filter((book) => state.favorites.has(book.id));
        body = favorites.length
          ? `<div class="book-list">${favorites.map(renderBookRow).join("")}</div>`
          : `<div class="empty-note">收藏夹暂时是空的。</div>`;
      }

      if (type === "catalog") {
        body = renderCatalogList("catalog");
      }

      if (type === "highlights") {
        body = state.highlights.length
          ? `<div class="note-list">${state.highlights.map(renderHighlightRow).join("")}</div>`
          : `<div class="empty-note">阅读器里点击“划线”，喜欢的段落会留在这里。</div>`;
      }

      if (type === "goal") {
        const ratio = Math.min(1, state.todayMinutes / state.dailyGoal);
        body = `
          <article class="goal-card">
            <h3>每日 ${state.dailyGoal} 分钟</h3>
            <p>今天已完成 ${state.todayMinutes} 分钟，进度 ${Math.round(ratio * 100)}%。</p>
            <div class="action-strip">
              <button class="pill-button secondary" type="button" data-action="set-goal" data-goal="20">20 分钟</button>
              <button class="pill-button secondary" type="button" data-action="set-goal" data-goal="30">30 分钟</button>
              <button class="pill-button secondary" type="button" data-action="set-goal" data-goal="45">45 分钟</button>
            </div>
          </article>
        `;
      }

      if (type === "review") {
        const summary = weeklySummary();
        const topTags = tagStats().map((item) => item.tag).slice(0, 3);
        const nextBook = getBooks().find((book) => !state.shelf.has(book.id)) || getBooks().find((book) => book.progress < 100) || getBooks()[0];
        body = `
          <article class="goal-card">
            <h3>本周阅读复盘</h3>
            <p>你本周偏向 ${topTags.join("、") || "散文"}，阅读 ${summary.total} 分钟，平均每天 ${summary.average} 分钟。最适合下一步读：${escapeHTML(nextBook.title)}。</p>
            <div class="metric-row">
              <span class="metric"><strong>${summary.days}</strong><span>阅读天数</span></span>
              <span class="metric"><strong>${summary.collectionBooks}</strong><span>书单书</span></span>
              <span class="metric"><strong>${summary.reviewed}</strong><span>复习卡</span></span>
            </div>
            <div class="action-strip">
              <button class="pill-button" type="button" data-action="open-detail" data-id="${nextBook.id}">看看推荐</button>
              <button class="pill-button secondary" type="button" data-action="open-sheet" data-sheet="insights">数据中心</button>
            </div>
          </article>
          ${renderInsightPanels()}
        `;
      }

      if (type === "insights") {
        const summary = weeklySummary();
        body = `
          <article class="goal-card">
            <h3>阅读数据中心</h3>
            <p>本周阅读 ${summary.total} 分钟，${summary.days} 天有记录；当前主题偏好是 ${summary.activeTag}。</p>
            <div class="metric-row">
              <span class="metric"><strong>${summary.average}</strong><span>日均分钟</span></span>
              <span class="metric"><strong>${summary.stats.notes}</strong><span>笔记</span></span>
              <span class="metric"><strong>${summary.stats.highlights}</strong><span>划线</span></span>
            </div>
          </article>
          ${renderInsightPanels()}
          ${renderCalendarPanel()}
          ${renderAchievementPanel()}
          <div class="action-strip">
            <button class="pill-button" type="button" data-action="share-insights">生成周报摘要</button>
            <button class="pill-button secondary" type="button" data-action="open-sheet" data-sheet="goal">调整目标</button>
          </div>
        `;
      }

      if (type === "calendar") {
        const summary = weeklySummary();
        const unlocked = achievements().filter((item) => item.unlocked).length;
        body = `
          <article class="goal-card">
            <h3>本周阅读日历</h3>
            <p>不是打卡压力，而是看看阅读怎样慢慢回到日常。本周 ${summary.days} 天有阅读，已点亮 ${unlocked} 枚成就。</p>
            <div class="metric-row">
              <span class="metric"><strong>${summary.total}</strong><span>分钟</span></span>
              <span class="metric"><strong>${summary.days}</strong><span>阅读天</span></span>
              <span class="metric"><strong>${unlocked}</strong><span>成就</span></span>
            </div>
          </article>
          ${renderCalendarPanel()}
          ${renderAchievementPanel()}
          <div class="action-strip">
            <button class="pill-button" type="button" data-action="save-calendar-note">记录今日复盘</button>
            <button class="pill-button secondary" type="button" data-action="open-sheet" data-sheet="insights">数据中心</button>
          </div>
        `;
      }

      if (type === "notifications") {
        const notices = notificationItems();
        const unread = notices.filter((item) => item.unread).length;
        body = `
          <article class="goal-card">
            <h3>消息与提醒</h3>
            <p>只保留和阅读有关的轻提醒：今日计划、继续阅读、复习盒和离线书包。不做推送打扰。</p>
            <div class="metric-row">
              <span class="metric"><strong>${unread}</strong><span>未读</span></span>
              <span class="metric"><strong>${notices.length}</strong><span>全部</span></span>
              <span class="metric"><strong>${state.preferences.quietMode ? "开" : "关"}</strong><span>安静模式</span></span>
            </div>
            <div class="action-strip">
              <button class="pill-button" type="button" data-action="read-all-notifications">全部已读</button>
              <button class="pill-button secondary" type="button" data-action="open-sheet" data-sheet="preferences">提醒偏好</button>
            </div>
          </article>
          <div class="notification-list">
            ${notices.map(renderNotificationRow).join("")}
          </div>
        `;
      }

      if (type === "reviewBox") {
        const items = dueReviewItems();
        const pending = items.filter((item) => !state.reviewedItems.has(item.id)).length;
        body = `
          <article class="goal-card">
            <h3>今日书摘复习</h3>
            <p>把笔记和划线重新带回阅读日常。先看还没复习的卡片，再回看已经记住的句子。</p>
            <div class="metric-row">
              <span class="metric"><strong>${items.length}</strong><span>书摘卡</span></span>
              <span class="metric"><strong>${pending}</strong><span>待复习</span></span>
              <span class="metric"><strong>${state.reviewedItems.size}</strong><span>已记住</span></span>
            </div>
          </article>
          <div class="note-list">
            ${items.length ? items.map(renderReviewItem).join("") : `<div class="empty-note">读书时添加笔记或划线，这里会自动生成复习卡。</div>`}
          </div>
        `;
      }

      if (type === "reviews") {
        const reviewedBooks = getBooks().filter((book) => state.bookReviews[book.id]);
        body = reviewedBooks.length
          ? `<div class="note-list">${reviewedBooks.map(renderReviewRow).join("")}</div>`
          : `<div class="empty-note">还没有读后感受。读完后可以先写一条笔记，把真正想留下的句子收好。</div>`;
      }

      if (type === "collections") {
        const pinned = state.collections.filter((collection) => collection.pinned).length;
        const totalBooks = new Set(state.collections.flatMap((collection) => collection.books)).size;
        body = `
          <article class="goal-card">
            <h3>把书架按场景整理</h3>
            <p>个人书单适合晨读、睡前、自然观察这类固定场景。书单里的书仍会回到统一书架和离线书包。</p>
            <div class="metric-row">
              <span class="metric"><strong>${state.collections.length}</strong><span>书单</span></span>
              <span class="metric"><strong>${pinned}</strong><span>已固定</span></span>
              <span class="metric"><strong>${totalBooks}</strong><span>收录书</span></span>
            </div>
          </article>
          <div class="collection-list">
            ${state.collections.map(renderCollectionCard).join("")}
          </div>
        `;
      }

      if (type === "collection") {
        const collection = collectionById();
        const summary = collectionReadingSummary(collection);
        const books = summary.books;
        body = `
          <article class="collection-card">
            <h3>${escapeHTML(collection.title)}</h3>
            <p>${escapeHTML(collection.desc)}</p>
            <div class="metric-row">
              <span class="metric"><strong>${books.length}</strong><span>本书</span></span>
              <span class="metric"><strong>${summary.startedCount}</strong><span>在读</span></span>
              <span class="metric"><strong>${summary.topProgress}%</strong><span>最高位置</span></span>
            </div>
            <div class="action-strip">
              <button class="pill-button" type="button" data-action="pin-collection" data-collection="${collection.id}">${collection.pinned ? "取消固定" : "固定书单"}</button>
              <button class="pill-button secondary" type="button" data-action="cache-collection" data-collection="${collection.id}">整组离线</button>
            </div>
          </article>
          <div class="book-list">
            ${books.length ? books.map(renderBookRow).join("") : `<div class="empty-note">这个书单还没有书。可以从书籍详情里加入。</div>`}
          </div>
        `;
      }

      if (type === "finished") {
        const book = getBooks().find((item) => item.id === state.finishedBookId) || currentBook();
        const nextBook = nextRecommendation(book.id);
        body = `
          <article class="goal-card">
            <h3>${escapeHTML(book.title)} 已读完</h3>
            <p>这本书已经放进完成记录。先写一条读后笔记，再把划线放进复习盒，下一次打开能接着整理。</p>
            <div class="metric-row">
              <span class="metric"><strong>100%</strong><span>当前位置</span></span>
              <span class="metric"><strong>${book.minutes}</strong><span>分钟</span></span>
              <span class="metric"><strong>${state.notes.length}</strong><span>笔记</span></span>
            </div>
            <div class="book-note">下一本推荐：${escapeHTML(nextBook.title)} · ${escapeHTML(nextBook.reason)}</div>
            <div class="action-strip">
              <button class="pill-button" type="button" data-action="finish-note" data-id="${book.id}">写读后感</button>
              <button class="pill-button secondary" type="button" data-action="open-sheet" data-sheet="reviewBox">复习书摘</button>
              <button class="pill-button secondary" type="button" data-action="start-book" data-id="${nextBook.id}">读下一本</button>
            </div>
          </article>
        `;
      }

      if (type === "noteCard") {
        const note = state.notes.find((item) => item.id === state.cardNoteId) || state.notes[0];
        const copiedText = note && state.copiedCardNoteId === note.id ? state.copiedCardText : "";
        body = note ? `
          <article class="goal-card">
            <h3>书摘卡片</h3>
            <p style="font-family: var(--serif); color: var(--ink); font-size: 16px;">“${escapeHTML(note.text)}”</p>
            <div class="book-note">${escapeHTML(note.source)} · ${escapeHTML(note.date)}<br>静光阅读 · 把喜欢的句子留在光里</div>
            ${copiedText ? `<div class="book-note"><strong>已生成可复制文案</strong><br>${escapeHTML(copiedText).replace(/\n/g, "<br>")}</div>` : ""}
            <div class="action-strip">
              <button class="pill-button" type="button" data-action="copy-card">复制文案</button>
              <button class="pill-button secondary" type="button" data-action="open-sheet" data-sheet="notes">回到笔记</button>
            </div>
          </article>
        ` : `<div class="empty-note">还没有可生成卡片的笔记。</div>`;
      }

      if (type === "confirmRestart") {
        const book = getBooks().find((item) => item.id === state.pendingRestartBookId) || currentBook();
        const visibleProgress = bookVisibleProgress(book);
        body = `
          <article class="goal-card">
            <h3>确认从头阅读《${escapeHTML(book.title)}》？</h3>
            <p>这会把本书当前位置从 ${visibleProgress}% 回到第一页。你的笔记、划线、收藏和读后感受会保留。</p>
            <div class="metric-row">
              <span class="metric"><strong>${visibleProgress}%</strong><span>当前位置</span></span>
              <span class="metric"><strong>${currentReaderPage(book.id) + 1}/${bookPages(book.id).length}</strong><span>当前位置</span></span>
              <span class="metric"><strong>${state.notes.filter((note) => note.source.includes(book.title)).length}</strong><span>相关笔记</span></span>
            </div>
            <div class="action-strip">
              <button class="pill-button" type="button" data-action="resume-book" data-id="${book.id}">继续原位置</button>
              <button class="pill-button secondary" type="button" data-action="confirm-restart-book" data-id="${book.id}">确认从头阅读</button>
            </div>
          </article>
        `;
      }

      if (type === "topic") {
        const topic = topicById(state.activeTopicId);
        const books = topic.books.map((bookId) => getBooks().find((book) => book.id === bookId)).filter(Boolean);
        const savedCount = books.filter((book) => state.shelf.has(book.id)).length;
        body = `
          <article class="goal-card">
            <h3>${escapeHTML(topic.title)}</h3>
            <p>${escapeHTML(topic.note || topic.desc)}</p>
            <div class="metric-row">
              <span class="metric"><strong>${books.length}</strong><span>本书</span></span>
              <span class="metric"><strong>${savedCount}</strong><span>已入架</span></span>
              <span class="metric"><strong>${escapeHTML(topic.curator)}</strong><span>策划</span></span>
            </div>
            <div class="action-strip">
              <button class="pill-button" type="button" data-action="save-topic" data-topic="${topic.id}">加入整套书</button>
              <button class="pill-button secondary" type="button" data-action="filter-discover" data-category="${topic.category}">看同类书</button>
            </div>
          </article>
          <div class="book-list">
            ${books.map(renderBookRow).join("")}
          </div>
        `;
      }

      if (type === "authors") {
        const visibleAuthors = publicDomainAuthors();
        body = `
            <article class="goal-card">
              <h3>按作者找公版作品</h3>
              <p>这里不做关注流，只把作者和代表作放在一起，方便把同一作者的书收进书架。</p>
              <div class="action-strip">
                <button class="pill-button" type="button" data-action="switch-tab" data-tab="discover">回到发现</button>
              </div>
            </article>
            ${visibleAuthors.map(renderAuthorCard).join("")}
          `;
      }

      if (type === "author") {
        const author = authors.find((item) => item.id === state.activeAuthorId) || authorForBook(currentBook());
        const books = author.books.map((bookId) => getBooks().find((book) => book.id === bookId)).filter(Boolean);
        body = `
          <article class="author-card">
            <h3>${escapeHTML(author.name)} · ${escapeHTML(author.title)}</h3>
            <p>${escapeHTML(author.bio)}</p>
            <div class="room-meta">
              <span class="mini-tag">${escapeHTML(author.followers)}</span>
              <span class="mini-tag">${books.length} 本作品</span>
            </div>
            <div class="action-strip">
              <button class="pill-button" type="button" data-action="save-author-books" data-author="${author.id}">代表作入架</button>
            </div>
          </article>
          <div class="section-head">
            <h2 class="section-title">代表作品</h2>
            <span class="tag">${books.length} 本</span>
          </div>
          <div class="book-list">
            ${books.map(renderBookRow).join("")}
          </div>
        `;
      }

      if (type === "plan") {
        const sections = monthlyPlanSections();
        const candidates = monthlyPlanCandidateBooks();
        const totalBooks = new Set(sections.flatMap((section) => section.books.map((book) => book.id))).size;
        body = `
          <article class="goal-card">
            <h3>本月慢读书单</h3>
            <p>这不是排行榜，而是根据你的书架、阅读位置和资源库整理的轻阅读计划。</p>
            <div class="metric-row">
              <span class="metric"><strong>${totalBooks}</strong><span>本书</span></span>
              <span class="metric"><strong>${candidates.length}</strong><span>候选</span></span>
              <span class="metric"><strong>${state.monthlyPlanSaved ? "已入架" : "实时"}</strong><span>状态</span></span>
            </div>
            <div class="action-strip">
              <button class="pill-button" type="button" data-action="save-monthly-plan">${state.monthlyPlanSaved ? "候选书已入架" : "加入候选书"}</button>
              <button class="pill-button secondary" type="button" data-action="open-sheet" data-sheet="collections">整理个人书单</button>
            </div>
            <div class="book-note">计划会随书架和阅读位置实时更新；加入候选书只会扩充书架，不会覆盖你的阅读位置。</div>
          </article>
          ${sections.map((section) => `
            <div class="section-head">
              <h2 class="section-title">${escapeHTML(section.title)}</h2>
              <span class="tag">${section.books.length} 本</span>
            </div>
            <div class="book-note">${escapeHTML(section.desc)}</div>
            <div class="book-list">
              ${section.books.map(renderBookRow).join("")}
            </div>
          `).join("")}
        `;
      }

      if (type === "import") {
        const importedExists = state.importedBooks.some((book) => book.id === importBookSeed.id);
        const imported = getBooks().filter((book) => book.imported);
        const draftChars = state.importDraftText.trim().replace(/\s/g, "").length;
        body = `
          <article class="goal-card">
            <h3>把自己的文字放进书架</h3>
            <p>粘贴 TXT 正文后会生成一本本地书，自动加入书架和离线书包，并和公版书共用阅读器、笔记、划线和阅读位置。</p>
            <div class="metric-row">
              <span class="metric"><strong>${state.importedBooks.length}</strong><span>已导入</span></span>
              <span class="metric"><strong>${draftChars}</strong><span>草稿字数</span></span>
              <span class="metric"><strong>${state.shelf.size}</strong><span>书架书籍</span></span>
            </div>
            <div class="text-importer">
              <label>
                书名
                <input type="text" value="${escapeHTML(state.importDraftTitle)}" placeholder="不填则用正文第一行" data-action="edit-import-title" aria-label="导入书名">
              </label>
              <label>
                TXT 正文
                <textarea data-action="edit-import-text" placeholder="把无版权风险或自己的文本粘贴在这里。每个空行会成为一个段落，阅读器会自动切成多页。" aria-label="导入正文">${escapeHTML(state.importDraftText)}</textarea>
              </label>
            </div>
            <div class="action-strip">
              <button class="pill-button" type="button" data-action="import-book">导入文本</button>
              <button class="pill-button secondary" type="button" data-action="import-sample-book">${importedExists ? "已试用样章" : "试用样章"}</button>
              <button class="pill-button secondary" type="button" data-action="open-sheet" data-sheet="offline">离线管理</button>
            </div>
          </article>
          ${imported.length ? `<div class="book-list">${imported.map(renderBookRow).join("")}</div>` : `<div class="empty-note">还没有导入的书。先粘贴一段文本，再点击“导入文本”。</div>`}
        `;
      }

      if (type === "offline") {
        const books = shelfBooks();
        const offlineBooks = books.filter((book) => state.offlineBooks.has(book.id));
        const minutes = offlineBooks.reduce((sum, book) => sum + book.minutes, 0);
        body = `
          <article class="goal-card">
            <h3>离线书包</h3>
            <p>把最近要读的书提前缓存。原型会保存缓存状态，并在书架、详情和资源库里同步显示。</p>
            <div class="metric-row">
              <span class="metric"><strong>${offlineBooks.length}</strong><span>已缓存</span></span>
              <span class="metric"><strong>${minutes}</strong><span>分钟</span></span>
              <span class="metric"><strong>${books.length}</strong><span>可管理</span></span>
            </div>
          </article>
          <div class="book-list">
            ${books.length ? books.map(renderOfflineRow).join("") : `<div class="empty-note">书架里还没有可缓存的书。</div>`}
          </div>
        `;
      }

      if (type === "preferences") {
        const themeLabels = { sepia: "纸色", sage: "护眼", night: "夜间" };
        const prefRows = [
          ["quietMode", "安静模式", "减少运营提醒，保留继续阅读、复习和离线入口。"],
          ["syncProgress", "翻页计入今日分钟", "阅读位置始终保存；关闭后翻页不再增加今日分钟。"]
        ];
        body = `
          <article class="goal-card">
            <h3>默认阅读主题</h3>
            <p>新打开阅读器时优先使用 ${themeLabels[state.preferences.defaultTheme] || "纸色"} 主题，当前阅读页也会同步切换。</p>
            <div class="setting-row">
              <span>页面颜色</span>
              <span class="theme-dots">
                ${["sepia", "sage", "night"].map((themeName) => `<button class="theme-dot ${themeName} ${state.preferences.defaultTheme === themeName ? "active" : ""}" type="button" data-action="set-default-theme" data-theme="${themeName}" aria-label="${themeLabels[themeName]}"></button>`).join("")}
              </span>
            </div>
          </article>
          <div class="preference-list">
            ${prefRows.map(([key, title, desc]) => `
              <button class="plain-button preference-row" type="button" data-action="toggle-pref" data-pref="${key}">
                <span>
                  <h3>${title}</h3>
                  <p>${desc}</p>
                </span>
                <span class="mini-tag">${state.preferences[key] ? "开启" : "关闭"}</span>
              </button>
            `).join("")}
          </div>
        `;
      }

      if (type === "readerSearch") {
        const book = getBooks().find((item) => item.id === state.readerSearchBookId) || currentBook();
        const results = readerSearchResults(book.id);
        const activePage = currentReaderPage(book.id);
        body = `
          <div class="search-box" role="search">
            ${icon("search")}
            <input type="search" value="${escapeHTML(state.readerSearchQuery)}" placeholder="搜索当前书的句子" data-action="search-reader" aria-label="搜索当前书">
            <button class="text-link" type="button" data-action="clear-reader-search">清空</button>
          </div>
          <article class="goal-card">
            <h3>${escapeHTML(book.title)} · 书内查找</h3>
            <p>${state.readerSearchQuery ? `找到 ${results.length} 处和“${escapeHTML(state.readerSearchQuery)}”有关的段落。` : "输入关键词，可以在当前书的标题和段落里查找，并直接跳到对应页面。"}</p>
            <div class="metric-row">
              <span class="metric"><strong>${bookPages(book.id).length}</strong><span>页</span></span>
              <span class="metric"><strong>${results.length}</strong><span>结果</span></span>
              <span class="metric"><strong>${activePage + 1}</strong><span>当前页</span></span>
            </div>
          </article>
          <div class="catalog-list">
            ${results.length ? results.map((item) => `
              <button class="plain-button catalog-item" type="button" data-action="reader-search-jump" data-page="${item.pageIndex}">
                <strong>${escapeHTML(item.title)}</strong>
                <span>${escapeHTML(item.snippet)}……</span>
              </button>
            `).join("") : `<div class="empty-note">${state.readerSearchQuery ? "没有找到匹配段落，换一个更短的关键词试试。" : "可以试试“光”“安静”“窗”等关键词。"}</div>`}
          </div>
        `;
      }

      if (type === "focus") {
        const book = getBooks().find((item) => item.id === state.focusBookId) || currentBook();
        const lastSession = state.focusSessions[0];
        body = `
          <article class="goal-card">
            <h3>${escapeHTML(book.title)} · 专注阅读</h3>
            <p>把这一段时间只留给一本书。完成后会记录今日分钟、同步进度，并写入阅读日历。</p>
            <div class="metric-row">
              <span class="metric"><strong>${state.focusMinutes}</strong><span>分钟</span></span>
              <span class="metric"><strong>${state.todayMinutes}</strong><span>今日</span></span>
              <span class="metric"><strong>${state.focusSessions.length}</strong><span>专注</span></span>
            </div>
            <div class="action-strip">
              ${[10, 18, 30].map((minutes) => `<button class="pill-button ${state.focusMinutes === minutes ? "" : "secondary"}" type="button" data-action="set-focus-minutes" data-minutes="${minutes}">${minutes} 分钟</button>`).join("")}
            </div>
            <div class="book-note">${lastSession ? `上次专注：${escapeHTML(lastSession.bookTitle)} · ${lastSession.minutes} 分钟 · ${escapeHTML(lastSession.date)}` : "还没有专注记录。选一个时长，安静读完这一段。"}</div>
            <div class="action-strip">
              <button class="pill-button" type="button" data-action="complete-focus" data-id="${book.id}">完成专注</button>
              <button class="pill-button secondary" type="button" data-action="resume-book" data-id="${book.id}">继续原文</button>
            </div>
          </article>
        `;
      }

      if (type === "ranking") {
        const ranking = rankingById();
        const books = ranking.books.map((bookId) => getBooks().find((book) => book.id === bookId)).filter(Boolean);
        const savedCount = books.filter((book) => state.shelf.has(book.id)).length;
        body = `
          <article class="goal-card">
            <h3>${escapeHTML(ranking.title)}</h3>
            <p>${escapeHTML(ranking.desc)} ${escapeHTML(ranking.rule)}。</p>
            <div class="metric-row">
              <span class="metric"><strong>${books.length}</strong><span>上榜</span></span>
              <span class="metric"><strong>${savedCount}</strong><span>已入架</span></span>
              <span class="metric"><strong>${books.reduce((sum, book) => sum + book.minutes, 0)}</strong><span>分钟</span></span>
            </div>
            <div class="action-strip">
              <button class="pill-button" type="button" data-action="save-ranking" data-ranking="${ranking.id}">加入榜单书</button>
              <button class="pill-button secondary" type="button" data-action="open-detail" data-id="${books[0]?.id || state.selectedBookId}">查看榜首</button>
            </div>
          </article>
          <div class="book-list">
            ${books.map((book, index) => `
              <article class="book-row offline-row">
                <span class="mini-tag">#${index + 1}</span>
                <span>
                  <span class="row-title">${escapeHTML(book.title)}</span>
                  <p>${escapeHTML(book.author)} · ${book.minutes} 分钟 · ${book.readers} 在读</p>
                </span>
                <button class="pill-button secondary compact" type="button" data-action="open-detail" data-id="${book.id}">看详情</button>
              </article>
            `).join("")}
          </div>
        `;
      }

      return `
        <div class="sheet-head">
          <h2>${titles[type] || "阅读"}</h2>
          <button class="icon-button" type="button" data-action="close-sheet" aria-label="关闭">${icon("close")}</button>
        </div>
        <div class="sheet-body">
          ${body}
        </div>
      `;
    }

    function renderInsightPanels() {
      const week = weeklyMinutes();
      const maxMinutes = Math.max(...week.map((day) => day.minutes), 1);
      const tags = tagStats();
      return `
        <article class="insight-panel">
          <h3>本周阅读节奏</h3>
          <p>越高代表当天阅读分钟越多，今天会随阅读、复习和任务完成更新。</p>
          <div class="week-bars">
            ${week.map((day) => `
              <span class="week-bar ${day.active ? "active" : ""}">
                <i style="--height: ${Math.max(10, Math.round((day.minutes / maxMinutes) * 58))}px"></i>
                <span>${day.label}</span>
              </span>
            `).join("")}
          </div>
        </article>
        <article class="insight-panel">
          <h3>主题偏好</h3>
          <p>根据书架和路径里的图书主题生成，帮助你发现最近真正读进去的方向。</p>
          <div class="tag-bars">
            ${tags.map((item) => `
              <span class="tag-bar">
                <span>${escapeHTML(item.tag)}</span>
                <i style="--width: ${item.width}%"></i>
                <span>${item.count} 本</span>
              </span>
            `).join("")}
          </div>
        </article>
      `;
    }

    function renderCalendarPanel() {
      const days = readingCalendar();
      return `
        <article class="insight-panel">
          <h3>阅读日历</h3>

    function renderReader() {
      const book = currentBook();
      const pages = bookPages(book.id);
      const readerPage = currentReaderPage(book.id);
      const page = pages[readerPage % pages.length];
      const visibleProgress = pageProgress(book.id, readerPage);
      const isLastPage = readerPage >= pages.length - 1;
      const activeParagraph = selectedParagraphIndex(book.id);
      readerEl.className = `reader theme-${state.readerTheme} ${state.readerOpen ? "open" : ""}`;
      readerEl.style.setProperty("--reader-font", state.readerFont.toFixed(2));
      readerEl.innerHTML = `
        <div class="reader-top">
          <button class="icon-button" type="button" data-action="close-reader" aria-label="返回">${icon("back")}</button>
          <div class="reader-title">
            <h2>${escapeHTML(book.title)}</h2>
            <span>${escapeHTML(page.title)}</span>
          </div>
          <div class="reader-tools">
            <button class="icon-button" type="button" data-action="toggle-reader-drawer" data-drawer="catalog" aria-label="目录">${icon("catalog")}</button>
            <button class="icon-button" type="button" data-action="toggle-reader-drawer" data-drawer="settings" aria-label="阅读设置">${icon("settings")}</button>
          </div>
        </div>
        <article class="reader-page">
          <h3>${escapeHTML(page.title)}</h3>
          ${page.body.map((text, index) => `
            <p class="${activeParagraph === index ? "selected" : ""}">
              <button class="plain-button reader-paragraph-text" type="button" data-action="select-paragraph" data-paragraph="${index}" aria-label="选中第 ${index + 1} 段">${renderReaderText(text, book.id, readerPage, index)}</button>
              <span class="paragraph-tools" aria-label="段落操作">
                <button class="paragraph-tool" type="button" data-action="highlight-paragraph" data-paragraph="${index}" aria-label="划线这一段">${icon("highlighter")}</button>
                <button class="paragraph-tool" type="button" data-action="note-paragraph" data-paragraph="${index}" aria-label="给这一段写笔记">${icon("note")}</button>
              </span>
            </p>
          `).join("")}
        </article>
        ${renderReaderDrawer()}
        <div class="reader-progress-panel" aria-label="当前位置说明">
          <div class="reader-progress-row">
            <strong>当前位置</strong>
            <span class="page-meter" aria-label="当前位置 ${visibleProgress}%"><i style="--progress: ${visibleProgress}%"></i></span>
            <span>${readerPage + 1}/${pages.length} · ${visibleProgress}%</span>
          </div>
          <p class="reader-progress-note">这里表示你在本书中的位置；到最后一页就是 100%，写小结只是保存完读记录。</p>
        </div>
        <div class="reader-bottom">
          <button class="icon-button" type="button" data-action="reader-prev" aria-label="上一页">${icon("back")}</button>
          <button class="icon-button" type="button" data-action="highlight-paragraph" data-paragraph="${activeParagraph}" aria-label="划线当前段落">${icon("highlighter")}</button>
          <button class="icon-button" type="button" data-action="add-reader-note" aria-label="添加笔记">${icon("note")}</button>
          ${isLastPage
            ? `<button class="pill-button compact" type="button" data-action="finish-book">写小结</button>`
            : `<button class="icon-button" type="button" data-action="reader-next" aria-label="下一页">${icon("chevron")}</button>`}
        </div>
      `;
    }

    function renderReaderText(text, bookId, pageIndex, paragraphIndex) {
      const escaped = escapeHTML(text);
      const marked = state.highlights.some((item) => item.bookId === bookId && item.pageIndex === pageIndex && item.paragraphIndex === paragraphIndex);
      return marked ? `<mark>${escaped}</mark>` : escaped;
    }

    function renderReaderDrawer() {
      if (!state.readerDrawer || !state.readerOpen) return "";
      if (state.readerDrawer === "catalog") {
        return `
          <div class="reader-drawer">
            <h3>目录</h3>
            ${renderCatalogList("reader")}
          </div>
        `;
      }
      if (state.readerDrawer === "settings") {
        return `
          <div class="reader-drawer">
            <h3>阅读设置</h3>
            <article class="reader-setting">
              <h3>字号</h3>
              <p>当前 ${(state.readerFont * 17).toFixed(0)}px，适合长时间阅读。</p>
              <div class="setting-row">
                <button class="pill-button secondary" type="button" data-action="font-down">${icon("textDown")}小一点</button>
                <button class="pill-button secondary" type="button" data-action="font-up">${icon("textUp")}大一点</button>
              </div>
            </article>
            <article class="reader-setting">
              <h3>页面颜色</h3>
              <div class="setting-row">
                <span>护眼主题</span>
                <span class="theme-dots">
                  ${["sepia", "sage", "night"].map((theme) => `<button class="theme-dot ${theme} ${state.readerTheme === theme ? "active" : ""}" type="button" data-action="set-theme" data-theme="${theme}" aria-label="${theme}"></button>`).join("")}
                </span>
              </div>
            </article>
          </div>

      return "";
