    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        toastEl.classList.remove("show");
      }, 1500);
    }

    function fitStage() {
      const safeWidth = Math.max(window.innerWidth - 32, 1);
      const safeHeight = Math.max(window.innerHeight - 32, 1);
      const scale = Math.max(
        0.2,
        Math.min(safeWidth / DESIGN_WIDTH, safeHeight / DESIGN_HEIGHT, MAX_SCALE)
      );

      shell.style.width = `${DESIGN_WIDTH * scale}px`;
      shell.style.height = `${DESIGN_HEIGHT * scale}px`;
      phone.style.setProperty("--stage-scale", scale.toFixed(4));
    }

    function handleAction(action, target) {
      const id = target.dataset.id;
      const tab = target.dataset.tab;
      const sheet = target.dataset.sheet;
      const filter = target.dataset.filter;
      const category = target.dataset.category;
      const pageIndex = Number(target.dataset.page);
      const goal = Number(target.dataset.goal);
      const drawer = target.dataset.drawer;
      const theme = target.dataset.theme;
      const sort = target.dataset.sort;
      const pref = target.dataset.pref;
      const topicId = target.dataset.topic;
      const authorId = target.dataset.author;
      const collectionId = target.dataset.collection;
      const rankingId = target.dataset.ranking;
      const query = target.dataset.query;
      const notificationId = target.dataset.notification;
      const reviewId = target.dataset.review;
      const paragraphIndex = Number(target.dataset.paragraph);

      if (action === "switch-tab") {
        state.tab = tab;
        state.sheet = null;
        state.readerDrawer = null;
        render();
        return;
      }

      if (action === "open-reader") {
        ensureReaderPageForBook(state.selectedBookId);
        state.readerOpen = true;
        state.readerDrawer = null;
        saveState();
        render();
        return;
      }

      if (action === "close-reader") {
        state.readerOpen = false;
        state.readerDrawer = null;
        saveState();
        render();
        return;
      }

      if (action === "reader-next") {
        const pages = bookPages();
        const readerPage = currentReaderPage();
        const wasLastPage = readerPage >= pages.length - 1;
        if (wasLastPage) {
          showToast("已到最后一页，可以写完读小结");
          return;
        }
        const nextPage = setReaderPage(state.selectedBookId, readerPage + 1);
        syncProgressToReaderPage(state.selectedBookId, nextPage);
        if (state.preferences.syncProgress !== false) {
          addTodayMinutes(3);
        }
        saveState();
        render();
        return;
      }

      if (action === "finish-book") {
        const pages = bookPages();
        setReaderPage(state.selectedBookId, pages.length - 1);
        state.progress[state.selectedBookId] = 100;
        state.finishedBookId = state.selectedBookId;
        state.readerOpen = false;
        state.readerDrawer = null;
        state.sheet = "finished";
        addTodayMinutes(4);
        saveState();
        render();
        showToast("已读完这本书");
        return;
      }

      if (action === "reader-prev") {
        const readerPage = currentReaderPage();
        setReaderPage(state.selectedBookId, Math.max(0, readerPage - 1));
        saveState();
        renderReader();
        return;
      }

      if (action === "reader-jump" || action === "catalog-jump") {
        if (!Number.isNaN(pageIndex)) setReaderPage(state.selectedBookId, pageIndex);
        state.readerDrawer = null;
        if (action === "catalog-jump") {
          state.readerOpen = true;
          state.sheet = null;
        }
        saveState();
        render();
        return;
      }

      if (action === "open-reader-search") {
        const book = getBooks().find((item) => item.id === id) || currentBook();
        state.readerSearchBookId = book.id;
        state.selectedBookId = book.id;
        state.sheet = "readerSearch";
        renderSheet();
        return;
      }

      if (action === "reader-search-jump") {
        state.selectedBookId = state.readerSearchBookId || state.selectedBookId;
        if (!Number.isNaN(pageIndex)) setReaderPage(state.selectedBookId, pageIndex);
        state.readerOpen = true;
        state.readerDrawer = null;
        state.sheet = null;
        saveState();
        render();
        showToast("已跳到匹配段落");
        return;
      }

      if (action === "clear-reader-search") {
        state.readerSearchQuery = "";
        renderSheet();
        return;
      }

      if (action === "toggle-reader-drawer") {
        state.readerDrawer = state.readerDrawer === drawer ? null : drawer;
        renderReader();
        return;
      }

      if (action === "set-theme") {
        state.readerTheme = theme || "sepia";
        saveState();
        renderReader();
        return;
      }

      if (action === "set-default-theme") {
        state.preferences.defaultTheme = theme || "sepia";
        state.readerTheme = state.preferences.defaultTheme;
        saveState();
        render();
        showToast("默认主题已更新");
        return;
      }

      if (action === "font-up" || action === "font-down") {
        const delta = action === "font-up" ? .06 : -.06;
        state.readerFont = Math.min(1.22, Math.max(.88, state.readerFont + delta));
        saveState();
        renderReader();
        return;
      }

      if (action === "select-paragraph") {
        const paragraph = selectParagraph(Number.isNaN(paragraphIndex) ? 0 : paragraphIndex);
        renderReader();
        showToast(`已选中第 ${paragraph.paragraphIndex + 1} 段`);
        return;
      }

      if (action === "add-reader-note" || action === "add-note") {
        const paragraph = selectParagraph(selectedParagraphIndex());
        openNoteEditor(paragraphSource(paragraph), paragraph.text);
        saveState();
        showToast("已带入选中段落，可以补充自己的想法");
        return;
      }

      if (action === "note-paragraph") {
        const paragraph = selectParagraph(Number.isNaN(paragraphIndex) ? 0 : paragraphIndex);
        openNoteEditor(paragraphSource(paragraph), paragraph.text);
        saveState();
        showToast("已带入这一段，可以补充自己的想法");
        return;
      }

      if (action === "save-note-draft") {
        const text = state.noteDraft.trim();
        if (!text) {
          showToast("先写一点笔记内容");
          renderSheet();
          return;
        }
        const source = state.noteSource || currentPageSource();
        state.notes = [{
          id: `n${Date.now()}`,
          text,
          source,
          date: "刚刚"
        }, ...state.notes].slice(0, 10);
        state.noteDraft = "";
        state.noteSource = "";
        state.sheet = "notes";
        saveState();
        render();
        showToast("笔记已保存");
        return;
      }

      if (action === "clear-note-draft") {
        state.noteDraft = "";
        saveState();
        renderSheet();
        return;
      }

      if (action === "highlight-paragraph") {
        const paragraph = selectParagraph(Number.isNaN(paragraphIndex) ? selectedParagraphIndex() : paragraphIndex);
        const exists = state.highlights.some((item) => item.bookId === state.selectedBookId && item.pageIndex === paragraph.pageIndex && item.paragraphIndex === paragraph.paragraphIndex);
        if (!exists) {
          state.highlights = [{
            id: `h${Date.now()}`,
            bookId: state.selectedBookId,
            pageIndex: paragraph.pageIndex,
            paragraphIndex: paragraph.paragraphIndex,
            text: paragraph.text,
            source: paragraphSource(paragraph),
            date: "刚刚"
          }, ...state.highlights].slice(0, 12);
          showToast("已划线收藏");
        } else {
          showToast("这段已划线");
        }
        saveState();
        renderReader();
        return;
      }

      if (action === "open-sheet") {
        state.sheet = sheet;
        renderSheet();
        return;
      }

      if (action === "open-notification") {
        const notice = notificationById(notificationId);
        state.readNotifications.add(notice.id);
        saveState();
        if (notice.action === "open-focus") {
          const book = getBooks().find((item) => item.id === notice.bookId) || currentBook();
          state.focusBookId = book.id;
          state.selectedBookId = book.id;
          state.shelf.add(book.id);
          state.sheet = "focus";
          saveState();
          render();
          return;
        }
        state.sheet = notice.sheet || "notifications";
        renderSheet();
        return;
      }

      if (action === "read-all-notifications") {
        notificationItems().forEach((item) => state.readNotifications.add(item.id));
        saveState();
        render();
        showToast("提醒已全部标记为已读");
        return;
      }

      if (action === "open-focus") {
        const book = getBooks().find((item) => item.id === id) || currentBook();
        state.focusBookId = book.id;
        state.selectedBookId = book.id;
        state.shelf.add(book.id);
        state.sheet = "focus";
        saveState();
        render();
        return;
      }

      if (action === "set-focus-minutes") {
        const minutes = Number(target.dataset.minutes);
        state.focusMinutes = Number.isNaN(minutes) ? 18 : minutes;
        saveState();
        renderSheet();
        return;
      }

      if (action === "complete-focus") {
        const book = getBooks().find((item) => item.id === id || item.id === state.focusBookId) || currentBook();
        const minutes = state.focusMinutes || 18;
        state.focusBookId = book.id;
        state.selectedBookId = book.id;
        state.shelf.add(book.id);
        addTodayMinutes(minutes);
        advanceBookProgress(book.id, Math.max(5, Math.round(minutes / 3)), { advancePage: true });
        state.focusSessions = [{
          id: `f${Date.now()}`,
          bookId: book.id,
          bookTitle: book.title,
          minutes,
          date: "刚刚"
        }, ...state.focusSessions].slice(0, 8);
        saveState();
        render();
        showToast("专注阅读已记录");
        return;
      }

      if (action === "open-topic") {
        const topic = topicById(topicId);
        state.activeTopicId = topic.id;
        state.discoverCategory = topic.category;
        state.sheet = "topic";
        renderSheet();
        return;
      }

      if (action === "open-ranking") {
        const ranking = rankingById(rankingId);
        state.activeRankingId = ranking.id;
        state.sheet = "ranking";
        renderSheet();
        return;
      }

      if (action === "open-author") {
        const author = authors.find((item) => item.id === authorId) || authorForBook(currentBook());
        state.activeAuthorId = author.id;
        state.sheet = "author";
        renderSheet();
        return;
      }

      if (action === "open-collection") {
        state.activeCollectionId = collectionById(collectionId).id;
        state.sheet = "collection";
        renderSheet();
        return;
      }

      if (action === "save-topic") {
        const topic = topicById(topicId || state.activeTopicId);
        topic.books.forEach((bookId) => state.shelf.add(bookId));
        state.discoverCategory = topic.category;
        saveState();
        render();
        showToast("专题书单已加入书架");
        return;
      }

      if (action === "save-ranking") {
        const ranking = rankingById(rankingId || state.activeRankingId);
        ranking.books.forEach((bookId) => state.shelf.add(bookId));
        saveState();
        render();
        showToast("榜单图书已加入书架");
        return;
      }

      if (action === "save-author-books") {
        const author = authors.find((item) => item.id === authorId || item.id === state.activeAuthorId) || authorForBook(currentBook());
        author.books.forEach((bookId) => state.shelf.add(bookId));
        saveState();
        render();
        showToast("作者代表作已加入书架");
        return;
      }

      if (action === "pin-collection") {
        const collection = collectionById(collectionId);
        collection.pinned = !collection.pinned;
        if (collection.pinned) collection.books.forEach((bookId) => state.shelf.add(bookId));
        saveState();
        render();
        showToast(collection.pinned ? "书单已固定在书架" : "书单已取消固定");
        return;
      }

      if (action === "add-to-collection") {
        const book = getBooks().find((item) => item.id === id) || currentBook();
        const collection = collectionById(collectionId);
        if (!collection.books.includes(book.id)) collection.books = [book.id, ...collection.books];
        state.shelf.add(book.id);
        state.activeCollectionId = collection.id;
        saveState();
        render();
        showToast("已加入个人书单");
        return;
      }

      if (action === "cache-collection") {
        const collection = collectionById(collectionId);
        collection.books.forEach((bookId) => {
          state.shelf.add(bookId);
          state.offlineBooks.add(bookId);
        });
        saveState();
        render();
        showToast("整组书已加入离线书包");
        return;
      }

      if (action === "mark-reviewed") {
        if (reviewId) {
          state.reviewedItems.add(reviewId);
          addTodayMinutes(1);
          saveState();
          render();
          showToast("已放进记住的句子");
        }
        return;
      }

      if (action === "close-sheet") {
        state.sheet = null;
        renderSheet();
        return;
      }

      if (action === "open-detail") {
        state.sheet = "detail";
        state.detailId = id;
        renderSheet();
        return;
      }

      if (action === "filter-shelf") {
        state.shelfFilter = filter || "all";
        render();
        showToast(`已切到${shelfFilterLabel()}`);
        return;
      }

      if (action === "sort-shelf") {
        state.shelfSort = sort || "recent";
        saveState();
        render();
        showToast(`已按${shelfSortLabel()}排序`);
        return;
      }

      if (action === "filter-discover") {
        state.discoverCategory = category || "全部";
        state.tab = "discover";
        state.sheet = null;
        render();
        showToast(`已筛选${state.discoverCategory}`);
        return;
      }

      if (action === "use-search-prompt") {
        state.searchQuery = query || "";
        if (category) state.discoverCategory = category;
        rememberSearch(state.searchQuery);
        render();
        return;
      }

      if (action === "clear-search-history") {
        state.searchHistory = [];
        saveState();
        render();
        showToast("搜索历史已清除");
        return;
      }

      if (action === "clear-search") {
        rememberSearch(state.searchQuery);
        state.searchQuery = "";
        render();
        return;
      }

      if (action === "resume-book") {
        const book = getBooks().find((item) => item.id === id) || currentBook();
        state.selectedBookId = book.id;
        ensureReaderPageForBook(book.id);
        state.readerOpen = true;
        state.readerDrawer = null;
        state.sheet = null;
        state.pendingRestartBookId = null;
        state.shelf.add(book.id);
        saveState();
        render();
        showToast("已回到上次阅读位置");
        return;
      }

      if (action === "request-restart-book") {
        const book = getBooks().find((item) => item.id === id) || currentBook();
        state.pendingRestartBookId = book.id;
        state.sheet = "confirmRestart";
        renderSheet();
        return;
      }

      if (action === "confirm-restart-book") {
        const book = getBooks().find((item) => item.id === id || item.id === state.pendingRestartBookId) || currentBook();
        state.selectedBookId = book.id;
        setReaderPage(book.id, 0);
        state.progress[book.id] = 0;
        state.pendingRestartBookId = null;
        state.shelf.add(book.id);
        state.sheet = null;
        state.readerOpen = true;
        saveState();
        render();
        showToast("已从第一页重新开始");
        return;
      }

      if (action === "start-book") {
        state.selectedBookId = id;
        setReaderPage(id, 0);
        state.progress[id] = 0;
        state.shelf.add(id);
        state.sheet = null;
        state.readerOpen = true;
        saveState();
        render();
        return;
      }

      if (action === "toggle-favorite") {
        if (state.favorites.has(id)) {
          state.favorites.delete(id);
          showToast("已移出收藏");
        } else {
          state.favorites.add(id);
          showToast("已加入收藏");
        }
        saveState();
        render();
        return;
      }

      if (action === "toggle-shelf") {
        if (state.shelf.has(id)) {
          state.shelf.delete(id);
          showToast("已从书架移出");
        } else {
          state.shelf.add(id);
          showToast("已加入书架");
        }
        saveState();
        render();
        return;
      }

      if (action === "import-book") {
        const importedBook = createImportedBookFromDraft();
        if (!importedBook) {
          showToast("先粘贴一段 TXT 正文");
          renderSheet();
          return;
        }
        state.importedBooks = [importedBook, ...state.importedBooks].slice(0, 8);
        state.progress[importedBook.id] = 0;
        state.readerPages[importedBook.id] = 0;
        state.shelf.add(importedBook.id);
        state.offlineBooks.add(importedBook.id);
        state.importDraftTitle = "";
        state.importDraftText = "";
        showToast("文本已导入书架");
        saveState();
        render();
        return;
      }

      if (action === "import-sample-book") {
        const exists = state.importedBooks.some((book) => book.id === importBookSeed.id);
        if (!exists) {
          state.importedBooks = [{ ...importBookSeed, pages: importedSamplePages() }, ...state.importedBooks].slice(0, 8);
          state.progress[importBookSeed.id] = 0;
          state.readerPages[importBookSeed.id] = 0;
          showToast("样章已加入书架");
        } else {
          showToast("样章已在书架");
        }
        state.shelf.add(importBookSeed.id);
        state.offlineBooks.add(importBookSeed.id);
        saveState();
        render();
        return;
      }

      if (action === "toggle-offline") {
        const book = getBooks().find((item) => item.id === id);
        if (!book) return;
        if (state.offlineBooks.has(id)) {
          state.offlineBooks.delete(id);
          showToast("已移出离线书包");
        } else {
          state.offlineBooks.add(id);
          state.shelf.add(id);
          showToast("已加入离线书包");
        }
        saveState();
        render();
        return;
      }

      if (action === "toggle-pref") {
        if (pref && Object.prototype.hasOwnProperty.call(state.preferences, pref)) {
          state.preferences[pref] = !state.preferences[pref];
          saveState();
          render();
          showToast(state.preferences[pref] ? "偏好已开启" : "偏好已关闭");
        }
        return;
      }

      if (action === "highlight-to-note") {
        const item = state.highlights.find((highlight) => highlight.id === id);
        if (item) {
          state.notes = [{ id: `n${Date.now()}`, text: item.text, source: item.source, date: "刚刚" }, ...state.notes].slice(0, 10);
          saveState();
          render();
          showToast("已转为笔记");
        }
        return;
      }

      if (action === "delete-note") {
        state.notes = state.notes.filter((note) => note.id !== id);
        saveState();
        render();
        showToast("笔记已删除");
        return;
      }

      if (action === "delete-highlight") {
        state.highlights = state.highlights.filter((highlight) => highlight.id !== id);
        saveState();
        render();
        showToast("划线已删除");
        return;
      }

      if (action === "share-note") {
        state.cardNoteId = id;
        state.copiedCardNoteId = null;
        state.copiedCardText = "";
        state.sheet = "noteCard";
        renderSheet();
        showToast("书摘卡片已生成");
        return;
      }

      if (action === "copy-card") {
        const note = state.notes.find((item) => item.id === state.cardNoteId) || state.notes[0];
        const text = noteCardText(note);
        state.copiedCardNoteId = note?.id || null;
        state.copiedCardText = text;
        if (typeof navigator !== "undefined" && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => undefined);
        }
        renderSheet();
        showToast("卡片文案已生成");
        return;
      }

      if (action === "finish-note") {
        const book = getBooks().find((item) => item.id === id) || currentBook();
        const note = {
          id: `n${Date.now()}`,
          text: `读完《${book.title}》后，想把这份安静留给明天继续读。`,
          source: `${book.title} · 完读小结`,
          date: "刚刚"
        };
        state.notes = [note, ...state.notes].slice(0, 10);
        saveState();
        render();
        showToast("读后感已保存");
        return;
      }

      if (action === "share-insights") {
        const summary = weeklySummary();
        state.notes = [{
          id: `n${Date.now()}`,
          text: `本周读了 ${summary.total} 分钟，偏好 ${summary.activeTag}，书单里整理了 ${summary.collectionBooks} 本。`,
          source: "静光阅读 · 周报摘要",
          date: "刚刚"
        }, ...state.notes].slice(0, 10);
        saveState();
        render();
        showToast("周报摘要已放进笔记");
        return;
      }

      if (action === "save-calendar-note") {
        const summary = weeklySummary();
        const unlocked = achievements().filter((item) => item.unlocked).length;
        state.notes = [{
          id: `n${Date.now()}`,
          text: `本周阅读 ${summary.total} 分钟，${summary.days} 天有记录，点亮 ${unlocked} 枚安静成就。`,
          source: "静光阅读 · 阅读日历",
          date: "刚刚"
        }, ...state.notes].slice(0, 10);
        saveState();
        render();
        showToast("阅读日历已记录");
        return;
      }

      if (action === "set-goal") {
        if (!Number.isNaN(goal)) state.dailyGoal = goal;
        saveState();
        render();
        showToast(`目标已设为 ${state.dailyGoal} 分钟`);
        return;
      }

      if (action === "save-monthly-plan") {
        const candidates = monthlyPlanCandidateBooks();
        candidates.forEach((book) => state.shelf.add(book.id));
        state.monthlyPlanSaved = true;
        saveState();
        render();
        showToast(candidates.length ? "候选书已加入书架" : "候选书已经在书架里");
        return;
      }
    }

    document.addEventListener("click", (event) => {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      if (target.matches("input, textarea")) return;
      handleAction(target.dataset.action, target);
    });

    document.addEventListener("input", (event) => {
      const target = event.target;
      if (target instanceof HTMLTextAreaElement && target.dataset.action === "edit-note-draft") {
        state.noteDraft = target.value;
        saveState();
        return;
      }
      if (target instanceof HTMLTextAreaElement && target.dataset.action === "edit-import-text") {
        state.importDraftText = target.value;
        saveState();
        return;
      }
      if (!(target instanceof HTMLInputElement)) return;
      if (target.dataset.action === "edit-import-title") {
        state.importDraftTitle = target.value;
        saveState();
        return;
      }
      if (target.dataset.action === "search-library") {
        state.searchQuery = target.value;
        if (state.searchQuery.trim()) state.discoverCategory = "全部";
        render();
        const input = document.querySelector('[data-action="search-library"]');
        if (input) {
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        }
      }
      if (target.dataset.action === "search-reader") {
        state.readerSearchQuery = target.value;
        renderSheet();
        const input = document.querySelector('[data-action="search-reader"]');
        if (input) {
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        }
      }
    });

    window.addEventListener("resize", fitStage);
    fitStage();
    if (shouldPersistDailyReset || ensureTodayState()) saveState();
    render();
    loadRemoteCatalog();
  </script>
</body>
</html>
