<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>切歌别手滑</title>
    <style>
      .file-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #18202f;
        background: #f6f7fb;
      }

      .file-fallback__panel {
        width: min(420px, 100%);
        padding: 24px;
        border: 1px solid #d9dfeb;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 60px rgba(24, 32, 47, 0.12);
      }

      .file-fallback__panel h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }

      .file-fallback__panel p {
        margin: 0 0 18px;
        line-height: 1.6;
        color: #526072;
      }

      .file-fallback__panel a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 8px;
        color: #ffffff;
        background: #ff4d6d;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main id="app" class="app-shell">
      <section class="file-fallback">
        <div class="file-fallback__panel">
          <h1>切歌别手滑</h1>
          <p>这个 H5 需要通过本地服务打开。当前服务已启动时，请点击下面的本地预览地址。</p>
          <a href="http://127.0.0.1:5310/">打开本地预览</a>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
